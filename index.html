<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onsecur · Oportunidades (maqueta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0C263A;        /* azul espacial profundo */
  --azul-claro:#E2E8ED;
  --curry:#CC9B00;       /* amarillo curry */
  --curry-claro:#F8F0D8;
  --papel:#F2F2F4;
  --blanco:#FFFFFF;
  --negro:#000000;
  --gris:#66757F;
  --linea:#D9DEE3;
  --granate:#8A2F2F;
  --verde:#2E7D4F;
  --verde-claro:#E3F1E8;
  --rojo:#B3261E;
  --rojo-claro:#F6E1DF;
  --naranja:#C8601A;     /* aviso de inactividad */
  --naranja-claro:#FBE8DA;
  --r:5px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--azul);font-family:Montserrat,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-0.01em}

/* barra de maqueta */
.cinta{background:var(--curry);color:var(--azul);padding:6px 16px;font-size:12px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cinta span{font-weight:400}
.cinta button{text-decoration:underline;font-size:12px;font-weight:600}

#app{display:flex;min-height:calc(100vh - 30px)}
nav.rail{width:186px;flex:none;background:var(--azul);color:#A9B8C2;display:flex;flex-direction:column;padding:16px 10px;gap:2px}
.marca{padding:2px 10px 20px;line-height:1}
.marca b{display:block;color:#fff;font-size:19px;font-weight:800;letter-spacing:-0.03em}
.marca span{font-size:10px;color:#7C8E9A;letter-spacing:.02em}
.rail button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:8px 10px;border-radius:var(--r);color:#A9B8C2;text-align:left;font-weight:500}
.rail button:hover{background:#17364E;color:#fff}
.rail button[aria-current="true"]{background:var(--blanco);color:var(--azul);font-weight:600}
.rail .chip{font-size:11px;background:rgba(255,255,255,.15);padding:1px 6px;border-radius:20px}
.rail button[aria-current="true"] .chip{background:var(--azul-claro)}
.rail .pie{margin-top:auto;padding-top:12px;border-top:1px solid #1D4058;font-size:12px;color:#7C8E9A}
.rail .pie b{display:block;color:#C8D4DC;font-weight:600}
.rail .pie select{margin-top:6px;background:#17364E;border:1px solid #1D4058;color:#C8D4DC;border-radius:var(--r);padding:5px 6px;width:100%;font-size:12px}

main{flex:1;min-width:0;display:flex;flex-direction:column}
.cifras{display:flex;flex-wrap:wrap;background:var(--blanco);border-bottom:1px solid var(--linea)}
.cifra{padding:13px 20px;border-right:1px solid var(--linea);min-width:148px}
.cifra dt{font-size:12px;color:var(--gris);margin:0 0 1px;font-weight:500}
.cifra dd{margin:0;font-size:21px;font-weight:700;letter-spacing:-0.025em}
.cifra.aviso dd{color:var(--curry)}
.cifras .acciones{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 16px}

.btn{background:var(--azul);color:#fff;padding:8px 14px;border-radius:var(--r);font-weight:600}
.btn:hover{background:#163A55}
.btn.sec{background:var(--blanco);color:var(--azul);border:1px solid var(--linea);font-weight:500}
.btn.sec:hover{background:var(--papel)}
.btn.curry{background:var(--curry);color:var(--azul)}
.btn.verde{background:var(--verde);color:#fff}
.btn.verde:hover{background:#246540}
.btn.rojo{background:var(--rojo);color:#fff}
.btn.rojo:hover{background:#921F18}
.contenido{padding:20px;flex:1;overflow:auto}

/* tablero */
.tablero{display:flex;gap:12px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.columna{flex:0 0 248px;background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);display:flex;flex-direction:column;min-height:110px}
.columna.encima{border-color:var(--curry);box-shadow:0 0 0 2px var(--curry-claro)}
.columna header{padding:10px 12px 0}
.columna h3{font-size:13px;display:flex;justify-content:space-between;align-items:baseline}
.columna h3 span{font-weight:400;color:var(--gris);font-size:12px}
.columna .importe{font-size:15px;font-weight:700;margin-top:1px}
.barra{height:3px;background:var(--papel);margin-top:8px}
.barra i{display:block;height:100%;background:var(--azul)}
.columna .lista{padding:8px;display:flex;flex-direction:column;gap:8px}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-left:3px solid var(--azul);border-radius:4px;padding:9px 10px;text-align:left;width:100%;cursor:grab}
.tarjeta:hover{border-color:#BDC6CE;border-left-color:var(--azul)}
.tarjeta.estancada{border-left-color:var(--naranja)}
.tarjeta .cuenta{font-size:12px;color:var(--gris)}
.tarjeta .titulo{font-weight:600;margin:1px 0 6px;line-height:1.25}
.tarjeta .pie{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.tarjeta .valor{font-weight:700}
.tarjeta .dias{color:var(--gris)}
.tarjeta .marcas{display:flex;align-items:center;gap:6px}
.tarjeta .inactiva{background:var(--naranja-claro);color:var(--naranja);font-weight:700;font-size:11px;padding:1px 6px;border-radius:10px;white-space:nowrap}
#acceso{min-height:calc(100vh - 30px);display:grid;place-items:center;padding:20px;background:var(--azul)}
#acceso .ficha{background:var(--blanco);border-radius:6px;padding:30px 28px;width:min(380px,100%)}
#acceso .logo b{display:block;font-size:26px;font-weight:800;letter-spacing:-0.035em;line-height:1}
#acceso .logo span{font-size:12px;color:var(--gris);letter-spacing:.14em;text-transform:uppercase}
#acceso .lema{margin:14px 0 20px;color:var(--gris);font-size:13px}
#acceso .campo{margin-bottom:12px}
#acceso .demo{margin-top:22px;padding-top:16px;border-top:1px solid var(--linea)}
#acceso .demo span{font-size:12px;color:var(--gris)}
#acceso .demo div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#acceso .demo button{border:1px solid var(--linea);border-radius:20px;padding:4px 11px;font-size:12px;font-weight:500}
#acceso .demo button:hover{border-color:var(--curry);background:var(--curry-claro)}
.rail .pie button{padding:6px 0;font-size:12px;color:#7C8E9A;text-decoration:underline}
.vacio{padding:14px 12px;font-size:12px;color:var(--gris)}
.submes{font-size:11px;color:var(--gris);text-transform:none}
.cab2{display:flex;gap:10px;margin-top:6px;padding-bottom:9px;border-bottom:1px solid var(--linea)}
.cab2 div{flex:1}
.cab2 span{display:block;font-size:11px;color:var(--gris);font-weight:500}
.cab2 b{font-size:15px;font-weight:700;letter-spacing:-0.02em}
.columna.parada{background:#FAFAFB}
.columna.parada h3{color:var(--gris)}
.columna.vencido{border-color:#E0C9C9}
.columna.vencido h3,.columna.vencido .submes{color:var(--granate)}
.tarjeta.vencida{border-left-color:var(--granate)}
.tarjeta.ganada,.tarjeta.ganada:hover{border-left-color:var(--verde);background:var(--verde-claro)}
.tarjeta.perdida,.tarjeta.perdida:hover{border-left-color:var(--rojo);background:var(--rojo-claro)}
.tarjeta .cierreEst{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;color:#fff;margin-bottom:4px}
.tarjeta.ganada .cierreEst{background:var(--verde)}
.tarjeta.perdida .cierreEst{background:var(--rojo)}
.bandeja{margin-top:16px;background:var(--blanco);border:1px dashed #C3CBD2;border-radius:var(--r);padding:12px 14px}
.bandeja.encima{border-color:var(--curry);background:var(--curry-claro)}
.bandeja .lista{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.bandeja .tarjeta{flex:0 0 230px}
:focus-visible{outline:2px solid var(--curry);outline-offset:1px}


/* Informes: pestañas de subpantalla */
.subnav{display:flex;gap:4px;border-bottom:1px solid var(--linea);margin-bottom:18px;overflow-x:auto}
.subnav button{padding:9px 14px;font-size:13px;font-weight:500;color:var(--gris);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.subnav button:hover{color:var(--azul)}
.subnav button[aria-current="true"]{color:var(--azul);font-weight:600;border-bottom-color:var(--azul)}
.resHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.resKpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:18px}
.resKpi{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:13px 15px}
.resKpi.destacado{border-left:3px solid var(--curry)}
.resKpi dt{font-size:12px;color:var(--gris);font-weight:500;margin:0}
.resKpi dd{margin:2px 0 1px;font-size:22px;font-weight:700;letter-spacing:-0.025em}
.resKpi small{font-size:11px;color:var(--gris)}
.resCols{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;align-items:start}
@media(max-width:900px){.resCols{grid-template-columns:1fr}}
.resCaja h3{font-size:13px;margin-bottom:7px}
.sparks{display:block;height:6px;background:var(--azul);border-radius:3px;min-width:2px}
.totalFila td{font-weight:700;background:#FAFAFB;border-top:1px solid var(--linea)}
.dirFicha{color:var(--gris);font-size:12px;margin-top:2px}


.impTabs{display:flex;gap:8px;margin-bottom:16px}
.impTab{border:1px solid var(--linea);background:var(--blanco);border-radius:var(--r);padding:9px 15px;text-align:left;font-weight:600;font-size:13px}
.impTab span{display:block;font-weight:400;font-size:11px;color:var(--gris)}
.impTab.on{border-color:var(--azul);background:var(--azul);color:#fff}
.impTab.on span{color:#A9B8C2}
.impZona{border:1px dashed #C3CBD2;border-radius:var(--r);background:var(--blanco);padding:30px 20px;text-align:center}
.impZona.encima{border-color:var(--curry);background:var(--curry-claro)}
.impZona b{display:block;font-size:15px}
.impZona span{display:block;font-size:12px;color:var(--gris);margin-top:3px}
.copiaPasos{margin:12px 0 0;font-size:13px;color:var(--gris)}
.copiaAviso{margin-top:12px;padding:10px 12px;border-radius:var(--r);font-size:13px;background:var(--azul-claro)}
.copiaAviso.mal{background:#F6E3E3;color:var(--granate)}
.copiaAviso.bien{background:#E4EFE6;color:#23532E}
td.falta{color:var(--granate);font-weight:600}
.impResumen{margin-top:16px;background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:14px}
.impResumen h3{font-size:13px;margin-bottom:8px}
.impResumen table{border:none}
.impReglas div{padding:7px 0;border-bottom:1px solid var(--linea)}
.impReglas div:last-child{border-bottom:none}
.impReglas dt{font-size:12px;font-weight:600}
.impReglas dd{margin:1px 0 0;font-size:12px;color:var(--gris)}


.seccion > h3 .mapa{font-weight:400;font-size:11px;color:var(--azul);margin-left:8px}
.avisoB10{font-size:11px;color:var(--gris);margin:6px 0 0}
.campo input:disabled,.campo select:disabled{background:#F4F4F6;color:#6B7A87}

/* tabla */
table{width:100%;border-collapse:collapse;background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r)}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--linea);font-size:13px}
th{font-size:12px;color:var(--gris);font-weight:600;background:#FAFAFB}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFAFB;cursor:pointer}
td.der,th.der{text-align:right}
.filtros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:7px 9px;width:100%}
.filtros select,.filtros input{width:auto;min-width:150px}
.etiqueta{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;background:var(--azul-claro);color:var(--azul);font-weight:500}
.etiqueta.ganada{background:var(--azul);color:#fff}
.etiqueta.perdida{background:#F1E3E3;color:var(--granate)}

/* cajón */
.velo{position:fixed;inset:0;background:rgba(12,38,58,.4);display:none;z-index:20}
.velo.abierto{display:block}
.cajon{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--blanco);z-index:21;display:none;flex-direction:column}
.cajon.abierto{display:flex}
.cajon > header{padding:15px 20px;border-bottom:1px solid var(--linea);display:flex;gap:12px;align-items:flex-start;background:var(--azul);color:#fff}
.cajon > header h2{font-size:17px;flex:1}
.cajon > header .btn.sec{background:transparent;color:#fff;border-color:#2C5madre}
.cajon > header .btn.sec{border-color:#2C5271}
.cajon > header .btn.sec:hover{background:#17364E}
.cajon .cuerpo{padding:16px 20px 30px;overflow:auto;flex:1}
.cajon > footer{padding:12px 20px;border-top:1px solid var(--linea);display:flex;gap:8px;background:#FAFAFB;flex-wrap:wrap}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.campo{display:flex;flex-direction:column;gap:3px}
.campo.ancho{grid-column:1/-1}
.campo label{font-size:12px;color:var(--gris);font-weight:500}
.seccion{margin-top:20px;padding-top:14px;border-top:1px solid var(--linea)}
.seccion h3{font-size:13px;margin-bottom:10px}
.hito{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea)}
.hito .cuando{flex:none;width:60px;font-size:12px;color:var(--gris)}
.hito p{margin:0}
.hito .tipo{font-size:12px;color:var(--curry);font-weight:600}
.proxima{background:var(--curry-claro);border-left:3px solid var(--curry);padding:7px 10px;border-radius:4px;margin-top:6px;font-size:13px}
.proxima.vencida{background:#F1E3E3;border-left-color:var(--granate)}

.grupo{margin-bottom:22px}
.grupo h3{font-size:13px;margin-bottom:8px}
.grupo h3 span{font-weight:400;color:var(--gris)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.bloque{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px}
.bloque h3{font-size:13px;margin-bottom:12px}
.bloque p{margin:0 0 8px}
.fila-barra{display:grid;grid-template-columns:108px 1fr 92px;gap:10px;align-items:center;margin-bottom:7px;font-size:13px}
.pista{background:var(--papel);height:16px;border-radius:2px;overflow:hidden;display:flex}
.pista i{display:block;height:100%;background:var(--azul)}
.pista i.b{background:#9FB0BC}
.fila-barra .cifra-fin{text-align:right;font-weight:600}
ul.chequeo{margin:0;padding-left:18px}
ul.chequeo li{margin-bottom:6px}
.oculto{display:none!important}
/* ── Tablet ── */
@media (max-width:1024px){
  nav.rail{width:158px}
  .columna{flex:0 0 228px}
  .cifra{min-width:132px;padding:11px 15px}
  .cifra dd{font-size:18px}
  .rejilla{grid-template-columns:1fr}
}
/* ── Móvil ── */
@media (max-width:760px){
  #app{flex-direction:column}
  nav.rail{width:100%;flex-direction:row;align-items:center;gap:4px;padding:8px 10px;overflow-x:auto}
  .marca{padding:0 10px 0 2px;flex:none}
  .marca b{font-size:16px}
  .marca span{font-size:9px}
  .rail button{width:auto;flex:none;padding:7px 11px;font-size:13px}
  .rail .pie{margin-left:auto;border:none;padding:0 4px;flex:none;display:flex;gap:8px;align-items:center}
  .rail .pie span{display:none}
  .cifras{flex-wrap:nowrap;overflow-x:auto}
  .cifra{min-width:126px;flex:none}
  .cifras .acciones{position:sticky;right:0;background:var(--blanco);border-left:1px solid var(--linea);padding:0 12px}
  .contenido{padding:14px 12px 30px}
  /* los tableros pasan a columnas a pantalla casi completa, que se recorren deslizando */
  .tablero{scroll-snap-type:x mandatory;gap:10px}
  .columna{flex:0 0 86vw;scroll-snap-align:start}
  .bandeja .tarjeta{flex:0 0 78vw}
  /* en el móvil no se arrastra: se cambia la etapa desde la ficha */
  .tarjeta{cursor:pointer}
  /* las tablas pierden las columnas secundarias */
  th.opcional,td.opcional{display:none}
  th,td{padding:8px 10px}
  .filtros{gap:6px}
  .filtros select,.filtros input{min-width:0;flex:1 1 44%}
  .campos{grid-template-columns:1fr}
  .cajon{width:100%}
  .fila-barra{grid-template-columns:92px 1fr 78px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Previsiones muestra seis columnas a la vez, asi que la tarjeta va
   comprimida: mismo contenido, la mitad de alto. */
.tablero.previsiones .tarjeta{padding:4px 7px;border-left-width:2px}
.tablero.previsiones .tarjeta .cuenta{font-size:10px;line-height:1.2}
.tablero.previsiones .tarjeta .titulo{font-size:12px;margin:0 0 2px;line-height:1.2;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tablero.previsiones .tarjeta .pie{font-size:10px}
.tablero.previsiones .tarjeta .pie[style]{margin-top:1px !important}

/* Oportunidades: cabeceras que ordenan y selector de columnas. */
table.lista th.ord{cursor:pointer;user-select:none;white-space:nowrap}
table.lista th.ord:hover{color:var(--azul)}
table.lista th.ord.activa{color:var(--azul)}
table.lista th .flecha{font-size:9px;margin-left:3px}
table.lista td .sub{font-size:12px;color:var(--gris)}
table.lista tfoot td{font-weight:600;border-top:2px solid var(--linea);background:var(--blanco)}
details.columnas{margin:0 0 10px}
details.columnas summary{cursor:pointer;font-size:13px;color:var(--gris);
  display:inline-block;padding:4px 10px;border:1px solid var(--linea);border-radius:4px}
details.columnas > div{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;
  padding:10px;border:1px solid var(--linea);border-radius:4px;background:var(--blanco)}
details.columnas label{display:flex;gap:6px;align-items:center;font-size:13px;white-space:nowrap}
details.columnas input{width:auto}

/* Importador */
.impZona.encima{border-color:var(--azul);background:#f2f7ff}
.impCargados{display:flex;gap:10px;margin-top:10px}
.impCargados > div{flex:1;border:1px solid var(--linea);border-radius:4px;padding:8px 10px;
  font-size:12px;display:flex;flex-direction:column;gap:2px;background:var(--blanco)}
.impCargados > div.ok{border-left:3px solid var(--azul)}
.impCargados > div span{color:var(--gris)}
.impCargados button{align-self:flex-start;margin-top:4px;padding:2px 8px;font-size:11px}
.impDetalle{margin-top:16px}
.impDetalle h3{font-size:14px;margin:14px 0 6px}
.impDetalle table{font-size:12px}
.impDetalle p.sub{font-size:12px;color:var(--gris);margin:0 0 6px}
</style>
</head>
<body>

<div id="acceso">
  <div class="ficha">
    <div class="logo"><b>ONSECUR</b><span>Radar</span></div>
    <p class="lema">Seguimiento comercial</p>
    <div class="campo"><label for="lEmail">Correo</label><input id="lEmail" type="email" placeholder="nombre@onsecur.com"></div>
    <div class="campo"><label for="lClave">Contraseña</label><input id="lClave" type="password" placeholder="••••••••"></div>
    <button class="btn" id="lEntrar" style="width:100%;margin-top:6px">Entrar</button>
  </div>
</div>

<div id="app" class="oculto">
  <nav class="rail">
    <div class="marca"><b>ONSECUR</b><span>Radar</span></div>
    <button data-vista="panel" aria-current="true">Panel</button>
    <button data-vista="informes">Informes</button>
    <button data-vista="radar">Previsiones</button>
    <button data-vista="pipeline">Etapas</button>

/* PostgREST devuelve 1.000 filas por página. Con 953 abiertas vamos justos,
   así que se pagina siempre. */
async function todasLasFilas(tabla, columnas){
  const filas = []; let desde = 0;
  for(;;){
    const { data, error } = await SB.from(tabla).select(columnas).range(desde, desde+999);
    if(error) throw error;
    filas.push(...data);
    if(data.length < 1000) return filas;
    desde += 1000;
  }
}

    vertical      : cod('vertical', o.vertical),
    origen        : cod('origen',   o.origen),

    estado        : o.estado,
    probabilidad  : o.prob,
    fecha_revision: o.etapa === 'standby' ? (o.revision || null) : null,
    motivo_perdida: o.estado === 'perdida' ? (o.motivo || null) : null,
    notas         : o.notas || null,
    ultima_actividad: (o.tocada || '').slice(0,10) || null
  };

  if(o.estado === 'abierta'){
    f.cierre_previsto = o.etapa === 'standby' ? null : (o.cierre || null);
    f.cierre_real = null;
  } else {
    f.cierre_previsto = null;
    f.cierre_real = o.cierre || new Date().toISOString().slice(0,10);
  }
  return f;
}

async function sincronizar(o){

    if(String(o.id).startsWith('nuevo:')){
      const { data, error } = await SB.from('oportunidad')
        .insert(aFilaBD(o)).select('id').single();
      if(error) throw error;
      const viejo = o.id; o.id = String(data.id);
      D.acts.filter(a=>a.opo===viejo).forEach(a=>a.opo=o.id);
    } else {
      const { error } = await SB.from('oportunidad').update(aFilaBD(o)).eq('id', o.id);
      if(error) throw error;
    }
  }catch(e){
    console.error(e);
    aviso('No se ha podido guardar: ' + (e.message || e) + '. Recargando.');
    setTimeout(recargar, 1500);
  }
}

async function recargar(){

}

const MOTIVOS = ['Precio','Plazo','Solución','No responde','Pospone la inversión'];
/* Aviso de inactividad: días sin actividad a partir de los cuales la tarjeta
   se marca en naranja, según la etapa. Cerrado no avisa. */
const INACTIVIDAD_ETAPA = { estudio:15, enviada:15, negociacion:21, standby:70 };
const MESES_RADAR = 5;   // mes 0 + 4 siguientes, además de la columna de vencidas

/* ═══════ Datos de ejemplo ═══════ */
const hoyISO = n => { const d=new Date(); d.setDate(d.getDate()+(n||0)); return d.toISOString().slice(0,10); };
const haceDias = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString(); };

let SEMILLA = { usuarios:[], cuentas:[], opos:[], acts:[], pres:[] };
let D = estructuraClonada();
let vista = 'panel', comoUsuario = 'u1', abierta = null;
let informe = 'resultados';   // subpantalla activa dentro de Informes
let filtros = { texto:'', comercial:'', etapa:'', estado:'abierta' };
let radar = { comercial:'', prob:'', vertical:'', proyectista:'', orden:'importe' };

function estructuraClonada(){ return JSON.parse(JSON.stringify(SEMILLA)); }

/* ═══════ utilidades ═══════ */
const $ = s => document.querySelector(s);
const eur = n => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n||0);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dias = d => d == null || d === '' ? null : Math.floor((new Date(new Date().toDateString()) - new Date(new Date(d).toDateString()))/86400000);
const mesActual = () => new Date().toISOString().slice(0,7);
const vencida = o => !!o.cierre && o.cierre.slice(0,7) < mesActual();
const fechaCorta = d => d ? new Date(d).toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) : '—';
const etapaNombre = id => (ETAPAS.find(e=>e.id===id)||{}).nombre||id;
const usuario = id => (D.usuarios.find(u=>u.id===id)||{}).nombre||'—';
const cuentaNombre = id => (D.cuentas.find(c=>c.id===id)||{}).nombre||'—';
/* Fecha de creación: la del primer presupuesto de la oportunidad (no la de la
   última versión). Se recalcula solo cuando cambia la lista de presupuestos. */
let _creacion = { ref:null, mapa:new Map() };
function fechaCreacion(o){
  if(_creacion.ref !== D.pres){
    const m = new Map();
    for(const p of D.pres||[]){
      if(!p.opo || !p.fecha) continue;
      const f = String(p.fecha).slice(0,10), act = m.get(p.opo);
      if(!act || f < act) m.set(p.opo, f);
    }
    _creacion = { ref:D.pres, mapa:m };
  }
  return _creacion.mapa.get(String(o.id)) || null;
}
/* Días sin actividad: desde la última actividad; si nunca la hubo, desde la
   creación del presupuesto. */
const diasSinActividad = o => dias(o.tocada || fechaCreacion(o));
/* Devuelve los días sin actividad si superan el umbral de su etapa; si no, null. */
function avisoInactividad(o){
  if(o.estado !== 'abierta') return null;
  const umbral = INACTIVIDAD_ETAPA[o.etapa];
  const d = diasSinActividad(o);
  return umbral && d != null && d >= umbral ? d : null;
}
const yo = () => D.usuarios.find(u=>u.id===comoUsuario);
const esManager = () => MI_ROL === 'director';
const mias = () => D.opos.filter(o => esManager() || o.owner===comoUsuario);
const abiertas = () => mias().filter(o=>o.estado==='abierta');
const nuevoId = p => p + Math.random().toString(36).slice(2,8);

/* Etapas pasa todos=true: su columna Cerrado necesita las cerradas aunque
   la lista este filtrada por estado, y alli el selector no se ve. */
const visibles = (todos) => mias().filter(o =>
  (todos || !filtros.estado || o.estado===filtros.estado) &&
  (!filtros.comercial || o.owner===filtros.comercial) &&
  (!filtros.etapa || o.etapa===filtros.etapa) &&
  (!filtros.texto || (o.nombre+' '+cuentaNombre(o.cuenta)+' '+(o.presupuestos||'')).toLowerCase().includes(filtros.texto.toLowerCase())));

const pendientes = () => D.acts

  .sort((a,b)=>a.proxFecha.localeCompare(b.proxFecha));


/* ═══════ Oportunidades: columnas y orden ═══════ */
/* Cada quien se monta la tabla como quiera. La eleccion se guarda en el
   navegador, no en la base: es una preferencia de pantalla, no un dato. */
const COLUMNAS = [
  { k:'nombre',     t:'Oportunidad',    fijo:true },

  { k:'revision',   t:'Revisión' },
  { k:'vertical',   t:'Vertical' },
  { k:'servicio',   t:'Sistema' },
  { k:'tipo',       t:'Actuación' },
  { k:'origen',     t:'Origen' },
  { k:'proyectista',t:'Proyectista' },
  { k:'poblacion',  t:'Población' },
  { k:'provincia',  t:'Provincia' },
  { k:'motivo',     t:'Motivo pérdida' },
  { k:'tocada',     t:'Sin tocar',      num:true }
];
const COLS_DEFECTO = ['nombre','cuenta','owner','etapa','valor','prob','cierre','tocada'];

let lista = { cols:[...COLS_DEFECTO], orden:'valor', dir:-1 };
try{
  const g = JSON.parse(localStorage.getItem('radar.lista') || 'null');
  if(g && Array.isArray(g.cols) && g.cols.length) lista = g;
}catch(e){ /* sin preferencia guardada, se usa la de serie */ }
function guardarLista(){
  try{ localStorage.setItem('radar.lista', JSON.stringify(lista)); }catch(e){}
}

/* Valor con el que se ordena: numero cuando lo es, texto en minusculas
   cuando no, para que la Ñ y los acentos no salten al final. */
function clave(o, k){
  switch(k){
    case 'valor': case 'prob': case 'cuota': return Number(o[k]) || 0;
    case 'ponderado': return (o.valor||0) * (o.prob||0) / 100;
    case 'tocada':    { const d = diasSinActividad(o); return d == null ? -1 : d; }
    case 'cuenta':    return cuentaNombre(o.cuenta).toLowerCase();
    /* E26/1000 va después de E26/999: los números se rellenan con ceros
       para que el orden de texto coincida con el numérico. */
    case 'presupuestos': return o.presupuestos
      ? String(o.presupuestos).toUpperCase().replace(/\d+/g, n => n.padStart(8,'0'))
      : '';
    case 'owner':     return usuario(o.owner).toLowerCase();
    case 'etapa':     return o.estado==='abierta' ? etapaNombre(o.etapa).toLowerCase() : o.estado;
    case 'cierre': case 'revision': return o[k] || '';
    default: return String(o[k] || '').toLowerCase();
  }
}
function ordenarLista(ops){
  const k = lista.orden, d = lista.dir;
  return [...ops].sort((a,b)=>{
    const x = clave(a,k), y = clave(b,k);
    if(x < y) return -d;
    if(x > y) return  d;
    return a.nombre.localeCompare(b.nombre);
  });
}

function celda(o, k){
  switch(k){
    case 'nombre': return `<strong>${esc(o.nombre)}</strong>` +
      (o.servicio?`<br><span class="sub">${esc(o.servicio)}</span>`:'');
    case 'cuenta': return esc(cuentaNombre(o.cuenta));
    case 'owner':  return esc(usuario(o.owner));
    case 'etapa':  return o.estado==='abierta'
      ? `<span class="etiqueta">${etapaNombre(o.etapa)}</span>`
      : `<span class="etiqueta ${o.estado}">${o.estado==='ganada'?'Ganada':'Perdida'}</span>`;
    case 'valor':  return eur(o.valor);
    case 'cuota':  return o.cuota ? eur(o.cuota) : '';
    case 'ponderado': return eur(o.valor * o.prob / 100);
    case 'prob':   return o.prob + '%';
    case 'cierre': case 'revision': return o[k] ? fechaCorta(o[k]) : '';
    case 'tocada': { const d = diasSinActividad(o); return d == null ? '—' : d + ' d'; }
    default: return esc(o[k] || '');
  }
}

/* ═══════════════════════════════════════════════════════════════════
   Importador de Beta10

   Lee los dos ficheros que se descargan de Beta10 y propone los cambios.
   Nada se escribe hasta que se pulsa Aplicar.

   Qué manda, según las reglas:
     - El Importe del cubo, que ya lleva el descuento. El Importe neto de
       la descarga de presupuestos es precio de tarifa y solo se usa si no
       hay cubo, y entonces restándole el descuento.
     - La fecha de aceptación del cubo manda sobre la del presupuesto.
     - La columna Principal decide qué versión cuenta. No es siempre la
       más alta.
     - El propietario de la cuenta manda sobre el comercial que diga
       Beta10. Es lo que corrige el caso de Ramón, que a propósito no
       figura como comercial.

   Lo que el importador NO toca de una ficha que ya existe: la
   probabilidad y la fecha prevista de cierre. Las pone el comercial y
   sería absurdo pisárselas cada semana.
   ═══════════════════════════════════════════════════════════════════ */

const EXCLUIDOS = ['ORONA', 'ICS 360', 'ICS360', 'CLIENTE PRUEBA', 'GOLD GYM', 'CLIENTE  ANTIGUO'];

const COMERCIAL_B10 = {
  'Puig Ferrer, Alejandro'     : 'alejandropuig',
  'Martínez Garreta, Sergio'   : 'sergiomartinez',
  'Palou Carballo, Ramón'      : 'ramonpalou',
  'Morera Ramos, Jorge'        : 'jorgemorera',
  'Buñuel López, Miguel Ángel' : 'miguelangel',
  'Callizo Silvestre, Gustavo' : 'gustavocallizo',
  'Simó, Jordi'                : 'jordisimo'
};

/* Beta10 junta actuación y sistema en un solo campo: "Instalación COMBINADO". */
const ACTUACION_B10 = {
  'Instalación':'Instalación', 'Ampliación':'Ampliación',
  'Avería Presencial':'Avería', 'Avería Remota':'Avería',
  'Averia de Guardia Presencial':'Avería',
  'Revisión anual':'Revisión', 'Revisión mensual':'Revisión',
  'Revisión trimestral':'Revisión',
  'Cambio titularidad':'Cambio de titularidad',
  'Gestión Cliente':'Gestión de cliente'
};
const SISTEMA_B10 = {
  'COMBINADO':'Combinado', 'CCTV':'CCTV', 'INTRUSIÓN':'Intrusión',
  'CONTROL DE ACCESO':'Control de acceso', 'SEGURIDAD FISICA':'Seguridad física',
  'PCI':'PCI'
};

/* Estado de Beta10 → dónde cae en el embudo de Radar. */
const ESTADO_B10 = {
  'En estudio técnico'          : { estado:'abierta', etapa:'estudio'     },
  'Pdte. de revisión comercial' : { estado:'abierta', etapa:'estudio'     },
  'Pdte. de aceptación'         : { estado:'abierta', etapa:'enviada'     },
  'Aceptado'                    : { estado:'ganada',  etapa:'cerrado'     },
  'Totalmente facturado'        : { estado:'ganada',  etapa:'cerrado'     },
  'Rechazado'                   : { estado:'perdida', etapa:'cerrado'     },
  'Anulado'                     : { estado:'perdida', etapa:'cerrado'     }
};

/* Tramos para estimar el cierre: p75 histórico entre emisión y aceptación. */
function cierreEstimado(importe, fecha){
  const dias = importe < 3000 ? 15 : importe < 25000 ? 30 : importe < 50000 ? 60 : 110;
  const base = fecha ? new Date(fecha) : new Date();
  const f = new Date(base.getTime() + dias*864e5);
  const hoy = new Date();
  if(f >= hoy) return f.toISOString().slice(0,10);
  /* Ya vencida al nacer: se lleva al último día del mes que viene. */
  return new Date(hoy.getFullYear(), hoy.getMonth()+2, 0).toISOString().slice(0,10);
}

/* Beta10 exporta el numero con ceros a la izquierda (E25/07) y en Radar
   esta guardado sin ellos (E25/7). Se normalizan los dos lados o no casa
   nada. */
const sinVersion = n => {
  const s = String(n||'').trim().replace(/\.\d+$/, '');
  const m = s.match(/^([A-Za-z]+)(\d+)\/0*(\d+)$/);
  return m ? m[1].toUpperCase() + m[2] + '/' + Number(m[3]) : s.toUpperCase();
};
/* Número con versión, normalizado igual: E25/07.2 → E25/7.2 */
const conVersion = n => {
  const s = String(n||'').trim(), m = s.match(/\.(\d+)$/);
  return sinVersion(s) + (m ? '.' + Number(m[1]) : '');
};
/* Las ganadas con cierre hasta aquí son histórico cerrado: el importador
   no las toca nunca. Septiembre sigue abierto y se cierra ya en Radar. */
const HISTORICO_HASTA = '2026-08-31';
const norm = s => String(s||'').trim().toUpperCase();
const esExcluido = cliente => EXCLUIDOS.some(x => norm(cliente).includes(x));

function fechaISO(v){
  if(!v) return null;
  /* Con cellDates, SheetJS devuelve la medianoche local. Pasarla a UTC en
     hora de Madrid la lleva al día anterior: se leen las cifras locales. */
  if(v instanceof Date){
    if(isNaN(v)) return null;
    return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  }
  if(typeof v === 'number'){                      /* fecha serie de Excel */
    const d = new Date(Date.UTC(1899,11,30) + v*864e5);
    return d.toISOString().slice(0,10);
  }
  const s = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  const m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return null;
}

/* ── lectura de los ficheros ────────────────────────────────────────── */

let impFicheros = { cubo:null, presupuestos:null, margenes:null };
let impPlan = null, impPlanMargen = null;

async function leerLibro(file){
  const buf = await file.arrayBuffer();
  const lib = XLSX.read(buf, { type:'array', cellDates:true });
  const hoja = lib.Sheets[lib.SheetNames[0]];
  return XLSX.utils.sheet_to_json(hoja, { defval:null });
}

/* Se reconocen por sus columnas, no por el nombre del fichero. */
function queFicheroEs(filas){
  if(!filas.length) return null;
  const cols = Object.keys(filas[0]);
  if(cols.includes('Serie/Num') && cols.includes('Fecha aceptación')) return 'cubo';
  if(cols.includes('Nº Presupuesto') && cols.includes('Principal'))   return 'presupuestos';
  if(cols.includes('PRESUPUESTO') && cols.includes('COSTE') && cols.includes('IMPORTETOTAL')) return 'margenes';
  return null;
}

async function recibirFicheros(files){
  for(const f of files){
    let filas;
    try{ filas = await leerLibro(f); }
    catch(e){ aviso('No se ha podido leer ' + f.name + ': ' + e.message); continue; }
    const tipo = queFicheroEs(filas);
    if(!tipo){
      aviso(f.name + ': no reconozco las columnas. ¿Es una descarga de Beta10 sin modificar?');
      continue;
    }
    impFicheros[tipo] = { nombre:f.name, filas };
  }
  impPlan = null; impPlanMargen = null;
  pintar();
}

/* ── el plan ────────────────────────────────────────────────────────── */

function construirPlan(){
  const pres = impFicheros.presupuestos ? impFicheros.presupuestos.filas : [];
  const cubo = impFicheros.cubo         ? impFicheros.cubo.filas         : [];

  /* El cubo trae una fila por versión. Se indexa por número con versión,
     para coger exactamente la versión Principal de la descarga, y por
     número sin versión como red cuando falta la descarga o la versión. */
  const porVersion = new Map(), porNumero = new Map();
  const nVer = s => { const m = String(s||'').trim().match(/\.(\d+)$/); return m ? Number(m[1]) : 0; };
  for(const r of cubo){
    const bruto = r['Serie/Num'];
    const n = sinVersion(bruto);
    if(!n) continue;
    porVersion.set(conVersion(bruto), r);
    const prev = porNumero.get(n);
    /* Sin Principal: vale la versión aceptada; si no hay, la más alta. */
    const gana = x => (ESTADO_B10[x['Estado']]||{}).estado === 'ganada';
    if(!prev || (gana(r) && !gana(prev)) || (gana(r) === gana(prev) && nVer(bruto) > nVer(prev['Serie/Num'])))
      porNumero.set(n, r);
  }

  const plan = { nuevas:[], actualiza:[], igual:[], version:0, excluidas:[],
                 sinImporte:[], desaparecidos:[], porImporte:[],
                 historico:0, revisar:[], presupuestos:[] };

  /* Las oportunidades que ya tenemos, por número de presupuesto. */
  const yaTengo = new Map();
  for(const o of D.opos)
    for(const n of String(o.presupuestos||'').split(',').map(x=>x.trim()).filter(Boolean))
      yaTengo.set(n, o);

  /* Lo que la base sabe de cada presupuesto, para sumar los que no vengan
     en este fichero. */
  const presBase = new Map((D.pres||[]).map(p => [p.numero, p]));

  /* Segunda red: fichas de Holded sin número de presupuesto. Se emparejan
     por cliente e importe y se listan aparte para revisarlas. */
  const porClienteImporte = new Map();
  for(const o of D.opos){
    if(String(o.presupuestos||'').trim()) continue;
    const k = norm(cuentaNombre(o.cuenta)) + '|' + Math.round(o.valor);
    if(!porClienteImporte.has(k)) porClienteImporte.set(k, o);
  }
  const usadas = new Set();

  /* Tercera red, antes que la de cliente e importe: muchas fichas de Holded
     llevan el número de Beta10 en el título («BETA E26-1392-2», «E26/597»,
     «#1387»). Casan por ese número solo si el importe también coincide,
     porque en Holded hay «#» antiguos que no son números de Beta10. */
  const porTitulo = new Map();
  const anio = String(new Date().getFullYear()).slice(2);
  const reNum = /\bE\s?(\d{2})\s?[\/-]\s?0*(\d{1,5})\b|#\s?0*(\d{3,5})\b/gi;
  for(const o of D.opos){
    if(String(o.presupuestos||'').trim()) continue;
    for(const m of String(o.nombre||'').matchAll(reNum)){
      const n = m[1] ? 'E' + m[1] + '/' + Number(m[2]) : 'E' + anio + '/' + Number(m[3]);
      if(!porTitulo.has(n)) porTitulo.set(n, []);
      porTitulo.get(n).push(o);
    }
  }
  const importeCasa = (o, imp) => Math.abs((o.valor||0) - imp) <= Math.max(1, Math.abs(imp)*0.01);

  /* Presupuestos que casan con una ficha existente, agrupados por ficha.
     La ficha se decide con todos sus presupuestos a la vez, nunca con uno. */
  const grupos = new Map();

  const vistos = new Set();
  const origen = pres.length ? pres : cubo;

  for(const r of origen){
    const bruto = pres.length ? r['Nº Presupuesto'] : r['Serie/Num'];
    const numero = sinVersion(bruto);
    if(!numero) continue;

    /* Principal decide la versión. */
    if(pres.length && r['Principal'] !== true && String(r['Principal']).toLowerCase() !== 'true'){
      plan.version++; continue;
    }
    if(vistos.has(numero)) { plan.version++; continue; }
    vistos.add(numero);

    const c = pres.length
      ? (porVersion.get(conVersion(bruto)) || porNumero.get(numero) || null)
      : porNumero.get(numero);
    const cliente = (pres.length ? r['Cliente/Cliente potencial'] : r['Nombre del Cliente']) || '';
    if(esExcluido(cliente)){ plan.excluidas.push({ numero, cliente }); continue; }

    /* Importe: manda el cubo. Si no hay, tarifa menos descuento. */
    let importe = c ? Number(c['Importe']) : null;
    if(importe === null || isNaN(importe)){
      const neto = Number(r['Importe neto']) || 0;
      const desc = Number(r['Descuento']) || 0;
      importe = Math.round(neto * (1 - desc/100) * 100) / 100;
    }
    if(!importe){ plan.sinImporte.push({ numero, cliente }); }

    const campo = String((pres.length ? r['Tipo de actuación'] : '') || '').trim();
    let actuacion = c ? c['Tipo de actuación'] : null, sistema = c ? c['Tipo de sistema'] : null;
    if(!actuacion && campo){
      const clave = Object.keys(ACTUACION_B10).find(k => campo.startsWith(k));
      actuacion = clave || null;
      sistema = clave ? campo.slice(clave.length).trim() : null;
    }

    const estadoB10 = (c ? c['Estado'] : r['Estado']) || 'En estudio técnico';
    const mapa = ESTADO_B10[estadoB10] || { estado:'abierta', etapa:'estudio' };
    const fPres = fechaISO(c ? c['Fecha presupuesto'] : r['Fecha']);
    const fAcep = fechaISO(c ? c['Fecha aceptación'] : null);

    const comB10 = r['Comercial'] || '';
    const ficha = {
      numero,
      version    : String(c ? c['Serie/Num'] : bruto).trim(),
      cliente    : String(cliente).trim(),
      titulo     : String(r['Título'] || r['Descripción del sistema'] || cliente).trim()
                   + ' · ' + numero,
      direccion  : String(r['Dirección'] || '').replace(/[\r\n]+/g, ', ').trim(),
      importe,
      cuota      : c ? (Number(c['Importe cuotas']) || 0) : 0,
      comercial  : COMERCIAL_B10[String(comB10).trim()] || null,
      actuacion  : ACTUACION_B10[actuacion] || null,
      sistema    : SISTEMA_B10[norm(sistema)] || null,
      estado     : mapa.estado,
      etapa      : mapa.etapa,
      fechaPres  : fPres,
      fechaAcep  : fAcep,
      fechaCierre: fAcep || fPres,
      estadoB10
    };

    let existente = yaTengo.get(numero);
    let emparejadaPorImporte = false;
    if(!existente){
      const cand = (porTitulo.get(numero) || [])
        .find(o => !usadas.has(o.id) && importeCasa(o, importe));
      if(cand){
        existente = cand; usadas.add(cand.id); emparejadaPorImporte = true;
      }
    }
    if(!existente){
      const k = norm(ficha.cliente) + '|' + Math.round(importe);
      const cand = porClienteImporte.get(k);
      if(cand && !usadas.has(cand.id)){
        existente = cand; usadas.add(cand.id); emparejadaPorImporte = true;
      }
    }
    if(!existente){
      /* Una venta nueva con fecha dentro del histórico cerrado no entra
         sola: cambiaría un cierre que ya está dado por bueno. */
      if(ficha.estado === 'ganada' && ficha.fechaCierre && ficha.fechaCierre <= HISTORICO_HASTA){
        plan.revisar.push({ o:{ nombre:ficha.titulo }, numeros:numero,
          motivo:'Aceptada el ' + ficha.fechaCierre + ', dentro del histórico cerrado. No se crea.' });
        continue;
      }
      ficha.cierrePrevisto = ficha.estado === 'abierta'
        ? cierreEstimado(importe, fPres) : null;
      plan.nuevas.push(ficha);
      continue;
    }
    if(!grupos.has(existente.id))
      grupos.set(existente.id, { o:existente, fichas:[], porImporte:false });
    const g = grupos.get(existente.id);
    g.fichas.push(ficha);
    if(emparejadaPorImporte) g.porImporte = true;
    plan.presupuestos.push({
      numero:ficha.numero, version:ficha.version, importe:ficha.importe,
      importe_cuotas:ficha.cuota, fecha:ficha.fechaPres, fecha_aceptacion:ficha.fechaAcep,
      estado:ficha.estadoB10, oportunidad_id:Number(existente.id)
    });
  }

  /* ── cada ficha existente, con todos sus presupuestos ── */
  const estadoDe = e => (ESTADO_B10[e] || { estado:'abierta' }).estado;
  for(const { o, fichas, porImporte } of grupos.values()){
    /* Todos los presupuestos de la ficha: los del fichero y, de los que no
       vienen, lo que ya sabía la base. */
    const todos = new Map();
    for(const n of String(o.presupuestos||'').split(',').map(x=>x.trim()).filter(Boolean)){
      const p = presBase.get(n);
      if(p) todos.set(n, { importe:Number(p.importe)||0, estado:estadoDe(p.estado), fecha:p.fecha_aceptacion||p.fecha });
    }
    for(const f of fichas)
      todos.set(f.numero, { importe:f.importe, estado:f.estado, fecha:f.fechaCierre, etapa:f.etapa });
    const lista = [...todos.values()];

    const ganados  = lista.filter(p => p.estado === 'ganada');
    const abiertos = lista.filter(p => p.estado === 'abierta');
    const suma = a => Math.round(a.reduce((s,p)=>s+p.importe,0)*100)/100;

    /* Estado según el conjunto: ganada si hay alguno aceptado; perdida
       solo si todos están rechazados o anulados. */
    const estadoNuevo = ganados.length ? 'ganada' : abiertos.length ? 'abierta' : 'perdida';
    /* Importe: la suma de los que cuentan para ese estado. */
    const importeNuevo = ganados.length ? suma(ganados)
                       : abiertos.length ? suma(abiertos) : o.valor;

    const cambio = {}, cambios = [];
    const numeros = fichas.map(f=>f.numero).join(', ');

    /* 1. Histórico cerrado: no se toca nada. Si Beta10 dice otra cosa, se
          avisa para que lo mire dirección. */
    if(o.estado === 'ganada' && o.cierre && o.cierre <= HISTORICO_HASTA){
      plan.historico++;
      if(estadoNuevo !== 'ganada')
        plan.revisar.push({ o, numeros, motivo:'Cerrada en el histórico y Beta10 la da como ' + estadoNuevo });
      continue;
    }

    /* 2. Ganada: nunca baja de estado ni cambia de fecha. Solo se ajusta
          el importe a la suma de lo aceptado. */
    if(o.estado === 'ganada'){
      if(estadoNuevo !== 'ganada')
        plan.revisar.push({ o, numeros, motivo:'Ganada en Radar y Beta10 la da como ' + estadoNuevo + '. No se toca.' });
      else if(Math.abs((o.valor||0) - importeNuevo) > 0.5){
        cambio.importe = importeNuevo;
        cambios.push({ campo:'Importe', de:eur(o.valor), a:eur(importeNuevo) });
      }
    }

    /* 3. Abierta o perdida: puede ganarse. Una abierta solo se pierde si
          se pierden todos sus presupuestos. */
    else {
      if(Math.abs((o.valor||0) - importeNuevo) > 0.5){
        cambio.importe = importeNuevo;
        cambios.push({ campo:'Importe', de:eur(o.valor), a:eur(importeNuevo) });
      }
      const fechasG = ganados.map(p=>p.fecha).filter(Boolean).sort();
      if(estadoNuevo === 'ganada' && o.estado !== 'ganada'
         && fechasG[0] && fechasG[0] <= HISTORICO_HASTA){
        /* Ganada con fecha dentro del histórico cerrado: no se mueve sola. */
        plan.revisar.push({ o, numeros, motivo:'Aceptada el ' + fechasG[0] + ', dentro del histórico cerrado. Sigue ' + o.estado + '.' });
        continue;
      }
      if(estadoNuevo === 'ganada' && o.estado !== 'ganada'){
        const fechas = fechasG;
        Object.assign(cambio, { estado:'ganada', etapa:'cerrado', probabilidad:95,
          cierre_real: fechas[0] || new Date().toISOString().slice(0,10), cierre_previsto:null });
        cambios.push({ campo:'Estado', de:o.estado, a:'ganada' });
      } else if(estadoNuevo === 'perdida' && o.estado === 'abierta'){
        const fechas = lista.map(p=>p.fecha).filter(Boolean).sort();
        Object.assign(cambio, { estado:'perdida', etapa:'cerrado',
          cierre_real: fechas[fechas.length-1] || new Date().toISOString().slice(0,10), cierre_previsto:null });
        cambios.push({ campo:'Estado', de:'abierta', a:'perdida' });
      } else if(o.estado === 'abierta' && o.etapa === 'estudio'
                && fichas.some(f => f.etapa === 'enviada')){
        cambio.etapa = 'enviada';
        cambios.push({ campo:'Etapa', de:'Estudio', a:'Enviada' });
      }
    }

    const x = { ficha:fichas[0], numeros, o, cambios, cambio };
    if(porImporte) plan.porImporte.push(x);
    else if(cambios.length) plan.actualiza.push(x);
    else plan.igual.push(fichas[0]);
  }

  /* Presupuestos que Radar conoce y el fichero ya no trae. */
  for(const [n, o] of yaTengo)
    if(!vistos.has(n) && o.estado === 'abierta') plan.desaparecidos.push({ numero:n, o });

  return plan;
}

/* ── márgenes ───────────────────────────────────────────────────────
   Solo interesa el margen de lo ganado: del fichero de márgenes se
   cogen los presupuestos Aceptados o Totalmente facturados y se ignora
   todo lo demás. Se escribe el coste; el margen lo calcula la base
   (importe − coste). El importe no se toca nunca: manda el cubo.
   El coste sí entra en el histórico cerrado, porque es justo donde
   hace falta el margen. */
const GANADO_B10 = ['Aceptado', 'Totalmente facturado'];

function construirPlanMargen(){
  const filas = impFicheros.margenes ? impFicheros.margenes.filas : [];
  const plan = { presupuestos:[], fichas:[], incompletas:[], noEnRadar:[],
                 costeCero:[], difImporte:[], noGanadoRadar:[], excluidas:0,
                 ignorados:0, yaIgual:0 };

  /* Lo que el fichero dice de cada presupuesto ganado. El fichero repite
     algunas filas idénticas: se queda una por presupuesto. */
  const delFichero = new Map();
  for(const r of filas){
    if(!GANADO_B10.includes(String(r['ESTADO']||'').trim())){ plan.ignorados++; continue; }
    if(esExcluido(r['CLIENTE'])){ plan.excluidas++; continue; }
    const n = sinVersion(r['PRESUPUESTO']);
    if(!n || delFichero.has(n)) continue;
    delFichero.set(n, { numero:n, version:String(r['PRESUPUESTO']).trim(), cliente:r['CLIENTE'],
      coste:Number(r['COSTE']), importe:Number(r['IMPORTETOTAL']) });
  }

  const presRadar = new Map(D.pres.map(p => [sinVersion(p.numero), p]));
  const costeNuevo = new Map();          /* numero → coste que queda tras aplicar */

  for(const [n, m] of delFichero){
    const p = presRadar.get(n);
    if(!p){ plan.noEnRadar.push(m); continue; }
    if(!GANADO_B10.includes(p.estado)){ plan.noGanadoRadar.push({ ...m, estadoRadar:p.estado }); continue; }
    if(isNaN(m.coste) || m.coste <= 0){ plan.costeCero.push(m); continue; }
    if(Math.abs((p.importe||0) - m.importe) > Math.max(1, Math.abs(m.importe)*0.01)){
      plan.difImporte.push({ ...m, importeRadar:p.importe }); continue; }
    costeNuevo.set(n, m.coste);
    if(p.coste != null && Math.abs(p.coste - m.coste) <= 0.005) plan.yaIgual++;
    else plan.presupuestos.push({ numero:p.numero, coste:m.coste });
  }

  /* Coste de la ficha ganada: la suma de sus presupuestos ganados. Si a
     alguno le falta el coste, la ficha se queda con el margen pendiente
     en lugar de enseñar un margen inflado. */
  const porOpo = new Map();
  for(const p of D.pres){
    if(!p.opo || !GANADO_B10.includes(p.estado)) continue;
    if(!porOpo.has(p.opo)) porOpo.set(p.opo, []);
    porOpo.get(p.opo).push(p);
  }
  for(const o of D.opos){
    if(o.estado !== 'ganada') continue;
    const ps = porOpo.get(o.id);
    if(!ps || !ps.length) continue;
    const costes = ps.map(p => { const n = sinVersion(p.numero);
      return costeNuevo.has(n) ? costeNuevo.get(n) : p.coste; });
    if(costes.some(c => c == null)){
      if(o.coste == null) plan.incompletas.push({ o, faltan:ps.filter((p,i)=>costes[i]==null).map(p=>p.numero) });
      continue;
    }
    const total = Math.round(costes.reduce((s,c)=>s+c,0)*100)/100;
    if(o.coste != null && Math.abs(o.coste - total) <= 0.005) continue;
    plan.fichas.push({ o, coste:total, antes:o.coste,
      margenPct: o.valor ? Math.round((o.valor-total)/o.valor*1000)/10 : null });
  }
  return plan;
}

async function aplicarPlan(){
  if(!impPlan) return;
  const b = $('#impAplicar');
  if(b){ b.disabled = true; b.textContent = 'Aplicando…'; }

  try{
    /* Cuentas que faltan. */
    const nombres = new Set(impPlan.nuevas.map(f => f.cliente).filter(Boolean));
    const tengo = new Map(D.cuentas.map(c => [c.nombre.toLowerCase(), c.id]));
    const faltan = [...nombres].filter(n => !tengo.has(n.toLowerCase()));
    if(faltan.length){
      const { data, error } = await SB.from('cuenta')
        .insert(faltan.map(n => ({ nombre:n }))).select('id,nombre');
      if(error) throw error;
      for(const c of data){
        D.cuentas.push({ id:String(c.id), nombre:c.nombre });
        tengo.set(c.nombre.toLowerCase(), String(c.id));
      }
    }

    /* Altas. */
    if(impPlan.nuevas.length){
      const filas = impPlan.nuevas.map(f => ({
        titulo         : f.titulo,
        cliente        : f.cliente,
        cuenta_id      : Number(tengo.get(f.cliente.toLowerCase())) || null,
        calle          : f.direccion || null,
        comercial      : f.comercial,
        tipo_actuacion : f.actuacion ? COD.actuacion[f.actuacion] : null,
        tipo           : f.actuacion ? TIPO_DE_ACTUACION[COD.actuacion[f.actuacion]] : 'obra',
        tipo_sistema   : f.sistema ? COD.sistema[f.sistema] : null,
        importe        : f.importe,
        cuota_anual    : f.cuota,
        etapa          : f.etapa,
        estado         : f.estado,
        probabilidad   : f.etapa === 'enviada' ? 20 : f.estado === 'ganada' ? 95 : 10,
        cierre_previsto: f.estado === 'abierta' ? f.cierrePrevisto : null,
        cierre_real    : f.estado === 'abierta' ? null : f.fechaCierre,
        origen_dato    : 'beta10'
      }));
      const { data, error } = await SB.from('oportunidad').insert(filas).select('id');
      if(error) throw error;
      const { error:e2 } = await SB.from('presupuesto').insert(impPlan.nuevas.map((f,i) => ({
        numero:f.numero, version:f.version, importe:f.importe, importe_cuotas:f.cuota,
        fecha:f.fechaPres, fecha_aceptacion:f.fechaAcep, estado:f.estadoB10,
        oportunidad_id:data[i].id
      })));
      if(e2) throw e2;
    }

    /* Cambios sobre fichas que ya existen: solo lo que ha decidido el plan
       con todos sus presupuestos. Ni probabilidad ni fecha prevista. */
    for(const { o, cambio } of [...impPlan.actualiza, ...impPlan.porImporte]){
      if(!Object.keys(cambio).length) continue;
      const { error } = await SB.from('oportunidad').update(cambio).eq('id', o.id);
      if(error) throw error;
    }

    /* Los presupuestos de las fichas existentes se refrescan siempre, para
       que la próxima suma parta de datos al día. Las emparejadas por
       importe quedan enganchadas por número. */
    for(let i=0; i<impPlan.presupuestos.length; i+=500){
      const { error } = await SB.from('presupuesto')
        .upsert(impPlan.presupuestos.slice(i, i+500), { onConflict:'numero' });
      if(error) throw error;
    }

    impFicheros.cubo = null; impFicheros.presupuestos = null;
    impPlan = null; impPlanMargen = null;
    await recargar();
    aviso('Importación aplicada.', true);
  }catch(e){
    console.error(e);
    aviso('La importación ha fallado: ' + (e.message || e));
    if(b){ b.disabled = false; b.textContent = 'Aplicar importación'; }
  }
}

let impDetalle = false, mrgDetalle = false;

/* ═══════ Copia de seguridad ═══════
   Solo dirección. Descarga todo Radar en dos formatos:
   - Excel legible: las fichas con sus etiquetas, notas, historial y catálogos.
   - JSON completo: las tablas tal cual están en la base, para poder
     reconstruirla si algún día hace falta.
   La lista de tablas la da radar.conteo_copia(), que además dice cuántas
   filas hay de verdad en cada una. Al terminar se compara: si falta algo,
   la pantalla lo dice en lugar de dar la copia por buena. */

const COPIA_NOMBRES = {
  oportunidad:'Oportunidades', presupuesto:'Presupuestos Beta10', nota:'Notas y actividad',
  cambio:'Historial de cambios', cuenta:'Cuentas', cuenta_alias:'Alias de cuentas',
  prescriptor:'Prescriptores', prescriptor_contacto:'Contactos de prescriptores',
  perfil:'Usuarios', objetivo:'Objetivos', proyectista:'Proyectistas',
  importacion:'Importaciones', import_revision:'Revisiones de importación',
  exportacion:'Copias hechas', etapa:'Etapas', tipo_oportunidad:'Tipos de oportunidad',
  tipo_actuacion:'Tipos de actuación', tipo_sistema:'Tipos de sistema',
  vertical:'Verticales', vertical_alias:'Alias de verticales', origen:'Orígenes',
  motivo_perdida:'Motivos de pérdida', motivo_exclusion:'Motivos de exclusión',
  tramo_importe:'Tramos de importe', ajuste:'Ajustes'
};
/* Orden en pantalla y en el Excel: primero lo que es trabajo del equipo. */
const COPIA_ORDEN = ['oportunidad','presupuesto','nota','cambio','cuenta','cuenta_alias',
  'prescriptor','prescriptor_contacto','perfil','objetivo','proyectista',
  'importacion','import_revision','exportacion'];
/* Clave por la que se ordena al paginar. Sin orden fijo, PostgREST puede
   repetir o saltarse filas entre una página y la siguiente. */
const COPIA_CLAVE = { perfil:['id'], objetivo:['tag_comercial','anio','mes'],
  vertical_alias:['alias'], cuenta_alias:['alias'], ajuste:['clave'] };
const claveCopia = t => COPIA_CLAVE[t] ||
  (['cuenta','prescriptor','prescriptor_contacto','oportunidad','presupuesto','nota',
    'cambio','importacion','import_revision','exportacion'].includes(t) ? ['id'] : ['codigo']);

let copia = { conteo:null, ultima:null, cargando:false, trabajando:'', resultado:null, error:'' };

const nombreTabla = t => COPIA_NOMBRES[t] || t.replace(/_/g,' ');
const ordenTablas = ts => [...ts].sort((a,b)=>{
  const ia = COPIA_ORDEN.indexOf(a), ib = COPIA_ORDEN.indexOf(b);
  return (ia<0?99:ia)-(ib<0?99:ib) || nombreTabla(a).localeCompare(nombreTabla(b),'es');
});
const fechaHora = d => d ? new Date(d).toLocaleString('es-ES',
  {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
const sello = () => { const d = new Date(), z = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`; };
const numES = n => new Intl.NumberFormat('es-ES').format(n||0);

async function leerConteo(){
  const { data, error } = await SB.rpc('conteo_copia');
  if(error) throw error;
  return Object.fromEntries(data.map(r => [r.tabla, Number(r.filas)]));
}

async function filasCopia(tabla, claves){
  const filas = []; let desde = 0;
  for(;;){
    let q = SB.from(tabla).select('*');
    claves.forEach(k => q = q.order(k, { ascending:true }));
    const { data, error } = await q.range(desde, desde+999);
    if(error) throw new Error(`${nombreTabla(tabla)}: ${error.message}`);
    filas.push(...data);
    if(data.length < 1000) return filas;
    desde += 1000;
  }
}

async function cargarEstadoCopia(){
  copia.cargando = true; copia.error = '';
  try{
    copia.conteo = await leerConteo();
    const { data } = await SB.from('exportacion')
      .select('hecha_en,autor_nombre,formato,total_filas,completa')
      .order('hecha_en', { ascending:false }).limit(5);
    copia.ultima = data || [];
  }catch(e){ copia.error = e.message || String(e); }
  copia.cargando = false;
  if(vista === 'copia') pintar();
}

/* Lee todo. Devuelve las tablas, la vista de oportunidades y la comprobación. */
async function leerTodo(){
  const conteo = await leerConteo();
  const tablas = ordenTablas(Object.keys(conteo));
  const datos = {};
  for(const [i,t] of tablas.entries()){
    copia.trabajando = `Leyendo ${nombreTabla(t).toLowerCase()} (${i+1} de ${tablas.length})…`;
    pintarTrabajoCopia();
    datos[t] = await filasCopia(t, claveCopia(t));
  }
  copia.trabajando = 'Leyendo las fichas completas…'; pintarTrabajoCopia();
  const fichas = await filasCopia('v_oportunidad', ['id']);
  const faltan = tablas.filter(t => datos[t].length !== conteo[t])
    .map(t => ({ tabla:t, copia:datos[t].length, base:conteo[t] }));
  if(fichas.length !== (conteo.oportunidad||0))
    faltan.push({ tabla:'v_oportunidad', copia:fichas.length, base:conteo.oportunidad||0 });
  const total = tablas.reduce((s,t)=>s+datos[t].length,0);
  return { conteo, tablas, datos, fichas, faltan, total };
}

function pintarTrabajoCopia(){
  const e = $('#copiaTrabajo'); if(e) e.textContent = copia.trabajando;
}

async function registrarCopia(formato, r){
  const { error } = await SB.from('exportacion').insert({
    autor_nombre: MI_PERFIL.nombre, formato, total_filas: r.total,
    conteo: Object.fromEntries(r.tablas.map(t=>[t, r.datos[t].length])),
    completa: r.faltan.length === 0
  });
  if(error) console.warn('No se ha podido registrar la copia:', error.message);
}

function descargarBlob(blob, nombre){
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}

/* ── Excel legible ── */
function libroCopia(r){
  const { datos, fichas, conteo, tablas, faltan } = r;
  const etiqueta = t => Object.fromEntries((datos[t]||[]).map(x=>[x.codigo, x.nombre]));
  const L = { proyectista:etiqueta('proyectista'), origen:etiqueta('origen'),
    tipo_actuacion:etiqueta('tipo_actuacion'), tipo_sistema:etiqueta('tipo_sistema'),
    motivo_perdida:etiqueta('motivo_perdida'), motivo_exclusion:etiqueta('motivo_exclusion'),
    etapa:etiqueta('etapa'), vertical:etiqueta('vertical'), tipo:etiqueta('tipo_oportunidad') };
  const cuentas = Object.fromEntries((datos.cuenta||[]).map(x=>[x.id, x.nombre]));
  const opo = Object.fromEntries(fichas.map(o=>[o.id, o]));
  const comercial = tag => tag ? ((datos.perfil||[]).find(p=>p.tag_comercial===tag)?.nombre
                                  || COMERCIALES[tag] || tag) : '';
  const si = b => b===true ? 'Sí' : b===false ? 'No' : '';
  const dia = d => d ? String(d).slice(0,10) : '';
  const cuando = d => d ? fechaHora(d) : '';
  const estado = { abierta:'Abierta', ganada:'Ganada', perdida:'Perdida' };

  const wb = XLSX.utils.book_new();
  const hoja = (nombre, filas, anchos) => {
    const ws = XLSX.utils.json_to_sheet(filas.length ? filas : [{ '':'Sin registros' }]);
    const cab = Object.keys(filas[0]||{});
    ws['!cols'] = cab.map((k,i)=>({ wch: (anchos&&anchos[i]) || Math.min(45, Math.max(10, k.length+2)) }));
    if(filas.length) ws['!autofilter'] = { ref: ws['!ref'] };
    XLSX.utils.book_append_sheet(wb, ws, nombre.slice(0,31));
  };

  /* Portada */
  const portada = [
    ['Radar · copia de seguridad'], [],
    ['Fecha', fechaHora(new Date())], ['Hecha por', MI_PERFIL.nombre],
    ['Estado', faltan.length ? 'INCOMPLETA: revisa las tablas marcadas' : 'Completa: coincide con la base'],
    ['Registros', r.total], [],
    ['Tabla', 'En la copia', 'En la base', 'Comprobación'],
    ...tablas.map(t=>[nombreTabla(t), datos[t].length, conteo[t],
      datos[t].length===conteo[t] ? 'OK' : 'FALTAN FILAS'])
  ];
  const wp = XLSX.utils.aoa_to_sheet(portada);
  wp['!cols'] = [{wch:32},{wch:34},{wch:12},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wp, 'Portada');

  /* Fichas de oportunidad */
  hoja('Oportunidades', fichas.map(o=>({
    'ID':o.id, 'Título':o.titulo, 'Cliente':o.cliente, 'Cuenta':cuentas[o.cuenta_id]||'',
    'Calle':o.calle||'', 'Población':o.poblacion||'', 'Provincia':o.provincia||'',
    'Comercial':o.comercial_nombre||comercial(o.comercial),
    'Proyectista':L.proyectista[o.proyectista]||o.proyectista||'',
    'Tipo':o.tipo_nombre||o.tipo||'', 'KPI':o.kpi||'',
    'Tipo de actuación':L.tipo_actuacion[o.tipo_actuacion]||o.tipo_actuacion||'',
    'Tipo de sistema':L.tipo_sistema[o.tipo_sistema]||o.tipo_sistema||'',
    'Vertical':o.vertical_nombre||o.vertical||'', 'Origen':L.origen[o.origen]||o.origen||'',
    'Prescriptor':o.prescriptor_nombre||'',
    'Etapa':o.etapa_nombre||o.etapa, 'Estado':estado[o.estado]||o.estado,
    'Probabilidad %':o.probabilidad, 'Importe':Number(o.importe)||0,
    'Ponderado':Number(o.ponderado)||0, 'Cuota anual':Number(o.cuota_anual)||0,
    'Coste':o.coste==null?'':Number(o.coste), 'Margen':o.margen==null?'':Number(o.margen),
    'Margen %':o.margen_pct==null?'':Number(o.margen_pct),
    'Cierre previsto':dia(o.cierre_previsto), 'Fecha estimada por tramo':si(o.cierre_estimado),
    'Vencida':si(o.vencida), 'Fecha de revisión':dia(o.fecha_revision),
    'Cierre real':dia(o.cierre_real),
    'Motivo de pérdida':L.motivo_perdida[o.motivo_perdida]||o.motivo_perdida||'',
    'Cuenta en resultados':si(o.cuenta_resultados),
    'Motivo de exclusión':L.motivo_exclusion[o.motivo_exclusion]||o.motivo_exclusion||'',
    'Presupuestos':o.presupuestos, 'Última actividad':dia(o.ultima_actividad),
    'Días sin actividad':o.dias_sin_actividad, 'Notas de la ficha':o.notas||'',
    'Origen del dato':o.origen_dato, 'Creada':cuando(o.creado_en), 'Actualizada':cuando(o.actualizado_en)
  })), [7,40,32,28]);

  hoja('Presupuestos', (datos.presupuesto||[]).map(b=>({
    'Número':b.numero, 'Versión':b.version||'', 'Principal':si(b.principal),
    'ID oportunidad':b.oportunidad_id||'', 'Oportunidad':opo[b.oportunidad_id]?.titulo||'',
    'Cliente Beta10':b.cliente_b10||'', 'Título Beta10':b.titulo||'',
    'Importe':Number(b.importe)||0, 'Importe cuotas':Number(b.importe_cuotas)||0,
    'Coste':b.coste==null?'':Number(b.coste), 'Fecha':dia(b.fecha),
    'Fecha de aceptación':dia(b.fecha_aceptacion), 'Estado':b.estado||'',
    'Facturación':b.estado_facturacion||'', 'Tipo de actuación':b.tipo_actuacion||'',
    'Tipo de sistema':b.tipo_sistema||'', 'Comercial en Beta10':b.comercial_b10||'',
    'Desaparecido':si(b.desaparecido), 'Visto por última vez':cuando(b.visto_en)
  })));

  hoja('Notas', (datos.nota||[]).map(n=>({
    'ID oportunidad':n.oportunidad_id, 'Oportunidad':opo[n.oportunidad_id]?.titulo||'',
    'Cliente':opo[n.oportunidad_id]?.cliente||'', 'Fecha':dia(n.fecha_actividad),
    'Tipo':n.tipo, 'Texto':n.texto, 'Próxima acción':dia(n.proxima_accion),
    'Autor':n.autor_nombre, 'Registrada':cuando(n.creada_en)
  })), [14,36,28,11,10,70]);

  const traduce = (campo, v) => {
    if(v==null) return '';
    const mapa = { etapa:L.etapa, vertical:L.vertical, origen:L.origen, tipo:L.tipo,
      motivo_perdida:L.motivo_perdida, motivo_exclusion:L.motivo_exclusion }[campo];
    if(mapa) return mapa[v] || v;
    if(campo==='comercial') return comercial(v);
    if(campo==='estado') return estado[v] || v;
    return v;
  };
  hoja('Historial de cambios', (datos.cambio||[]).map(x=>({
    'ID oportunidad':x.oportunidad_id, 'Oportunidad':opo[x.oportunidad_id]?.titulo||'',
    'Campo':x.campo, 'Antes':traduce(x.campo,x.valor_anterior),
    'Después':traduce(x.campo,x.valor_nuevo), 'Autor':x.autor_nombre, 'Cuándo':cuando(x.ocurrido_en)
  })), [14,36,18,24,24,22,17]);

  /* El resto, tal cual */
  const hechas = new Set(['oportunidad','presupuesto','nota','cambio']);
  tablas.filter(t=>!hechas.has(t)).forEach(t => hoja(nombreTabla(t),
    datos[t].map(f => Object.fromEntries(Object.entries(f).map(([k,v]) =>
      [k, v!==null && typeof v==='object' ? JSON.stringify(v) : (v ?? '')])))));
  return wb;
}

/* ── JSON completo ── */
function jsonCopia(r){
  return JSON.stringify({
    radar_copia: { version:1, esquema:'radar_v3', hecha_en:new Date().toISOString(),
      hecha_por:MI_PERFIL.nombre, completa:r.faltan.length===0,
      conteo_base:r.conteo, total_filas:r.total,
      nota:'Tablas base sin traducir. Para restaurar, cargar en orden: catálogos, ' +
           'perfil, cuenta, prescriptor, oportunidad, presupuesto, nota, cambio.' },
    tablas: Object.fromEntries(r.tablas.map(t=>[t, r.datos[t]]))
  }, null, 1);
}

async function hacerCopia(formato){
  if(copia.trabajando) return;
  copia.resultado = null; copia.error = ''; copia.trabajando = 'Preparando…'; pintar();
  try{
    const r = await leerTodo();
    copia.trabajando = 'Generando el fichero…'; pintarTrabajoCopia();
    const base = `Radar_copia_${sello()}`;
    if(formato === 'excel') XLSX.writeFile(libroCopia(r), base + '.xlsx', { compression:true });
    else descargarBlob(new Blob([jsonCopia(r)], { type:'application/json' }), base + '.json');
    await registrarCopia(formato, r);
    copia.resultado = { formato, total:r.total, tablas:r.tablas.length, faltan:r.faltan };
  }catch(e){ copia.error = e.message || String(e); }
  copia.trabajando = '';
  await cargarEstadoCopia();
}

          <button class="btn" id="copiaExcel" ${ocupado||!k?'disabled':''}>Descargar Excel</button>

        </div>
        ${ocupado ? `<p class="copiaPasos" id="copiaTrabajo">${esc(copia.trabajando)}</p>` : ''}
        ${copia.error ? `<div class="copiaAviso mal">No se ha podido hacer la copia: ${esc(copia.error)}</div>` : ''}
        ${res ? (res.faltan.length
          ? `<div class="copiaAviso mal"><b>La copia está incompleta.</b> Se ha descargado,

             No la des por buena.</div>`
          : `<div class="copiaAviso bien">Copia ${res.formato==='excel'?'en Excel':'completa'} descargada:
             ${numES(res.total)} registros de ${res.tablas} tablas, comprobados contra la base.</div>`) : ''}
      </div>

      <div class="impResumen">
        <h3>Últimas copias</h3>
        ${!copia.ultima ? '<p class="copiaPasos">Cargando…</p>' : !copia.ultima.length
          ? '<p class="copiaPasos" style="margin:0">Todavía no se ha hecho ninguna.</p>'
          : `<table><tbody>${copia.ultima.map(u=>`<tr>
              <td>${esc(fechaHora(u.hecha_en))}</td><td>${esc(u.autor_nombre)}</td>
              <td>${u.formato==='excel'?'Excel':'JSON'}</td>
              <td class="der num">${numES(u.total_filas)}</td>
              <td class="${u.completa?'':'falta'}">${u.completa?'Completa':'Incompleta'}</td></tr>`).join('')}
            </tbody></table>
            ${dias>=7?`<div class="copiaAviso">La última copia es de hace ${dias} días.</div>`:''}`}
      </div>
    </section>

    <section class="impResumen" style="margin-top:0">
      <h3>Qué entra</h3>
      ${!k ? `<p class="copiaPasos" style="margin:0">${copia.error?'—':'Contando registros…'}</p>` : `
      <table><tbody>
        ${tablas.map(t=>`<tr><td>${esc(nombreTabla(t))}</td><td class="der num">${numES(k[t])}</td></tr>`).join('')}
        <tr class="totalFila"><td>Total</td><td class="der num">${numES(total)}</td></tr>
      </tbody></table>`}
      <p class="copiaPasos">Incluye las oportunidades excluidas de resultados, marcadas como tales.
        Los datos no salen del navegador: el fichero se genera aquí y se descarga directamente.</p>
    </section>
  </div>`;

  const bx = $('#copiaExcel'), bj = $('#copiaJson');
  if(bx) bx.onclick = () => hacerCopia('excel');
  if(bj) bj.onclick = () => hacerCopia('json');
}

/* ═══════ Acceso ═══════ */
const zonaBotones = $('#lUsuarios');
if(zonaBotones) zonaBotones.remove();

async function iniciarSesion(){
  const email = $('#lEmail').value.trim();
  const clave = $('#lClave').value;
  if(!email || !clave) return alert('Escribe el correo y la contraseña.');
  $('#lEntrar').disabled = true; $('#lEntrar').textContent = 'Entrando…';
  const { error } = await SB.auth.signInWithPassword({ email, password: clave });
  $('#lEntrar').disabled = false; $('#lEntrar').textContent = 'Entrar';
  if(error) return alert('No se ha podido entrar: ' + error.message);
  await arrancar();
}

$('#lEntrar').onclick = iniciarSesion;
$('#lClave').onkeydown = e => { if(e.key === 'Enter') iniciarSesion(); };
$('#lEmail').onkeydown = e => { if(e.key === 'Enter') $('#lClave').focus(); };

$('#btnSalir').onclick = async () => {
  await SB.auth.signOut();
  cerrarCajon();
  $('#app').classList.add('oculto');
  $('#acceso').classList.remove('oculto');
  $('#lEmail').value = ''; $('#lClave').value = '';
};

const btnReset = $('#btnReset');
if(btnReset){ btnReset.textContent = 'Recargar'; btnReset.onclick = recargar; }

/* Arranque: si hay sesión abierta se entra directo. */
async function arrancar(){
  const { data:{ session } } = await SB.auth.getSession();
  if(!session){ $('#acceso').classList.remove('oculto'); return; }

  const { data:perfil, error } = await SB.from('perfil')
    .select('id,nombre,email,rol,tag_comercial').eq('id', session.user.id).maybeSingle();
  if(error || !perfil){
    alert('Tu usuario no tiene ficha en Radar. Avisa a dirección.');
    await SB.auth.signOut(); $('#acceso').classList.remove('oculto'); return;
  }
  MI_PERFIL = perfil; MI_ROL = perfil.rol;

  try{ await cargarDatos(); }
  catch(e){ alert('No se han podido cargar los datos: ' + (e.message||e)); return; }

  D = estructuraClonada();
  entrar(perfil.tag_comercial || '__dir');
}

let arrancado = false;
const arrancarUnaVez = () => { if(arrancado) return; arrancado = true; arrancar(); };
document.addEventListener('DOMContentLoaded', arrancarUnaVez);
if(document.readyState !== 'loading') arrancarUnaVez();

function entrar(id){
  comoUsuario = id;
  filtros = { texto:'', comercial:'', etapa:'', estado:'abierta' };
  radar = { comercial:'', prob:'', vertical:'', proyectista:'', orden:'importe' };
  vista = 'panel';
  informe = 'resultados';
  $('#usuarioActivo').textContent = yo().nombre;
  $('#rolActivo').textContent = yo().rol;
  $('#navCopia').classList.toggle('oculto', !esManager());
  $('#acceso').classList.add('oculto');
  $('#app').classList.remove('oculto');
  pintar();
}

function pintar(){
  document.querySelectorAll('.rail [data-vista]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.vista===vista)));
  pintarCifras();
  ({pipeline:vPipeline,radar:vRadar,lista:vLista,agenda:vAgenda,panel:vPanel,informes:vInformes,importar:vImportar,copia:vCopia})[vista]($('#contenido'));
}

function pintarCifras(){
  const ab = abiertas();
  const pond = ab.reduce((s,o)=>s+o.valor*o.prob/100,0);
  const mes = new Date().toISOString().slice(0,7);
  const esteMes = ab.filter(o=>(o.cierre||'').slice(0,7)===mes).reduce((s,o)=>s+o.valor,0);
  const anio = new Date().getFullYear();
  const ganado = mias().filter(o=>o.estado==='ganada').reduce((s,o)=>s+o.valor,0);
  const vencidas = pendientes().filter(a=>dias(a.proxFecha)>0).length;
  $('#chipLista').textContent = ab.length;
  $('#chipAgenda').textContent = pendientes().length;
  $('#cifras').innerHTML = `
    <div class="cifra"><dt>Pipeline abierto</dt><dd class="num">${eur(ab.reduce((s,o)=>s+o.valor,0))}</dd></div>
    <div class="cifra"><dt>Ponderado</dt><dd class="num">${eur(pond)}</dd></div>
    <div class="cifra"><dt>Cierre este mes</dt><dd class="num">${eur(esteMes)}</dd></div>
    <div class="cifra"><dt>Ganado ${anio}</dt><dd class="num">${eur(ganado)}</dd></div>
    <div class="cifra ${vencidas?'aviso':''}"><dt>Acciones vencidas</dt><dd class="num">${vencidas}</dd></div>
    <div class="acciones"><button class="btn" id="btnNueva">Nueva oportunidad</button></div>`;
  $('#btnNueva').onclick = () => abrirCajon(null);
}

/* ═══════ pipeline ═══════ */
function vPipeline(c){
  const ops = visibles(true);
  const enEtapa = e => e==='cerrado'
    ? ops.filter(o=>o.estado!=='abierta')
    : ops.filter(o=>o.estado==='abierta' && o.etapa===e);
  const max = Math.max(1,...ETAPAS.map(e=>enEtapa(e.id).reduce((s,o)=>s+o.valor,0)));
  c.innerHTML = filtrosHTML(false) + '<div class="tablero">' + ETAPAS.map(e=>{
    const l = enEtapa(e.id), t = l.reduce((s,o)=>s+o.valor,0);
    return `<section class="columna ${e.id==='standby'?'parada':''}" data-etapa="${e.id}">
      <header><h3>${e.nombre} <span class="num">${l.length}</span></h3>
      <div class="importe num">${eur(t)}</div>
      <div class="barra"><i style="width:${Math.round(t/max*100)}%"></i></div></header>
      <div class="lista">${l.length?l.map(tarjeta).join(''):'<p class="vacio">Nada en esta etapa. Arrastra una tarjeta aquí.</p>'}</div>
    </section>`;
  }).join('') + '</div>';
  activarFiltros(); activarArrastre();
}

function tarjeta(o){
  const edad = dias(fechaCreacion(o));
  const aviso = avisoInactividad(o);
  const cerrada = o.estado==='ganada' || o.estado==='perdida';
  const edadTxt = edad == null ? '—' : edad === 0 ? 'hoy' : edad + ' d';
  return `<button class="tarjeta ${cerrada?o.estado:(aviso!=null?'estancada':'')}" draggable="true" data-id="${o.id}">
    ${cerrada?`<span class="cierreEst">${o.estado==='ganada'?'Ganada':'Perdida'}</span>`:''}
    <div class="cuenta">${esc(cuentaNombre(o.cuenta))}</div>
    <div class="titulo">${esc(o.nombre)}</div>
    <div class="pie"><span class="valor num">${eur(o.valor)}</span><span class="marcas">${aviso!=null?`<span class="inactiva num" title="${aviso} días sin actividad (umbral de ${etapaNombre(o.etapa)}: ${INACTIVIDAD_ETAPA[o.etapa]} d)">⚠ ${aviso} d</span>`:''}<span class="dias num" title="Días desde el primer presupuesto">${edadTxt}</span></span></div>
  </button>`;
}

function activarArrastre(){
  document.querySelectorAll('.tarjeta').forEach(t=>{
    t.onclick = () => abrirCajon(D.opos.find(o=>o.id===t.dataset.id));
    t.ondragstart = e => e.dataTransfer.setData('text/plain',t.dataset.id);
  });
  document.querySelectorAll('.columna').forEach(col=>{
    col.ondragover = e => { e.preventDefault(); col.classList.add('encima'); };
    col.ondragleave = () => col.classList.remove('encima');
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove('encima');
      const o = D.opos.find(x=>x.id===e.dataTransfer.getData('text/plain'));
      if(!o || o.etapa===col.dataset.etapa) return;
      if(col.dataset.etapa==='cerrado'){ abrirCajon(o); return; }   // hay que decir si es ganada o perdida
      if(o.estado!=='abierta'){ o.estado='abierta'; o.motivo=null; }
      o.etapa = col.dataset.etapa;
      o.tocada = new Date().toISOString();
      if(o.etapa === 'standby' && !o.revision){
        /* Regla: al pasar a Stand By hay que decir cuándo se revisa. */
        const r = prompt('¿Cuándo se revisa? (aaaa-mm-dd)',
                          new Date(Date.now()+30*864e5).toISOString().slice(0,10));
        if(r) o.revision = r;
      }
      pintar(); sincronizar(o);
    };
  });
}
