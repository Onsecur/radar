document.querySelectorAll('.rail [data-vista]').forEach(b => b.onclick = () => { vista = b.dataset.vista; pintar(); });

/* ═══════ Acceso ═══════ */
const zonaBotones = $('#lUsuarios');
if(zonaBotones) zonaBotones.remove();

async function iniciarSesion(){
  const email = $('#lEmail').value.trim();
  const clave = $('#lClave').value;
  if(!email || !clave) return alert('Escribe el correo y la contraseña.');
  $('#lEntrar').disabled = true; $('#lEntrar').textContent = 'Entrando…';
  const { error } = await SB.auth.signInWithPassword({ email, password: clave });
  $('#lEntrar').disabled = false; $('#lEntrar').textContent = 'Entrar';
  if(error) return alert('No se ha podido entrar: ' + error.message);
  await arrancar();
}

$('#lEntrar').onclick = iniciarSesion;
$('#lClave').onkeydown = e => { if(e.key === 'Enter') iniciarSesion(); };
$('#lEmail').onkeydown = e => { if(e.key === 'Enter') $('#lClave').focus(); };

$('#btnSalir').onclick = async () => {
  await SB.auth.signOut();
  cerrarCajon();
  $('#app').classList.add('oculto');
  $('#acceso').classList.remove('oculto');
  $('#lEmail').value = ''; $('#lClave').value = '';
};

const btnReset = $('#btnReset');
if(btnReset){ btnReset.textContent = 'Recargar'; btnReset.onclick = recargar; }

/* Arranque: si hay sesión abierta se entra directo. */
async function arrancar(){
  const { data:{ session } } = await SB.auth.getSession();
  if(!session){ $('#acceso').classList.remove('oculto'); return; }

  const { data:perfil, error } = await SB.from('perfil')
    .select('id,nombre,email,rol,tag_comercial').eq('id', session.user.id).maybeSingle();
  if(error || !perfil){
    alert('Tu usuario no tiene ficha en Radar. Avisa a dirección.');
    await SB.auth.signOut(); $('#acceso').classList.remove('oculto'); return;
  }
  MI_PERFIL = perfil; MI_ROL = perfil.rol;

  try{ await cargarDatos(); }
  catch(e){ alert('No se han podido cargar los datos: ' + (e.message||e)); return; }

  D = estructuraClonada();
  entrar(perfil.tag_comercial || '__dir');
}

let arrancado = false;
const arrancarUnaVez = () => { if(arrancado) return; arrancado = true; arrancar(); };
document.addEventListener('DOMContentLoaded', arrancarUnaVez);
if(document.readyState !== 'loading') arrancarUnaVez();

function entrar(id){
  comoUsuario = id;
  filtros = { texto:'', comercial:'', etapa:'', estado:'abierta', actuacion:'' };
  radar = { comercial:'', prob:'', vertical:'', proyectista:'', orden:'importe' };
  vista = 'panel';
  informe = 'resultados';
  $('#usuarioActivo').textContent = yo().nombre;
  $('#rolActivo').textContent = yo().rol;
  $('#navCopia').classList.toggle('oculto', !esManager());
  $('#acceso').classList.add('oculto');
  $('#app').classList.remove('oculto');
  pintar();
}

function pintar(){
  document.querySelectorAll('.rail [data-vista]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.vista===vista)));
  pintarCifras();
  ({pipeline:vPipeline,radar:vRadar,lista:vLista,agenda:vAgenda,panel:vPanel,informes:vInformes,importar:vImportar,copia:vCopia})[vista]($('#contenido'));
}

function pintarCifras(){
  const ab = abiertas();
  const pond = ab.reduce((s,o)=>s+o.valor*o.prob/100,0);
  const mes = new Date().toISOString().slice(0,7);
  const esteMes = ab.filter(o=>(o.cierre||'').slice(0,7)===mes).reduce((s,o)=>s+o.valor,0);
  const anio = new Date().getFullYear();
  const ganado = mias().filter(o=>o.estado==='ganada').reduce((s,o)=>s+o.valor,0);
  const vencidas = pendientes().filter(a=>dias(a.proxFecha)>0).length;
  $('#chipLista').textContent = ab.length;
  $('#chipAgenda').textContent = pendientes().length;
  $('#cifras').innerHTML = `
    <div class="cifra"><dt>Pipeline abierto</dt><dd class="num">${eur(ab.reduce((s,o)=>s+o.valor,0))}</dd></div>
    <div class="cifra"><dt>Ponderado</dt><dd class="num">${eur(pond)}</dd></div>
    <div class="cifra"><dt>Cierre este mes</dt><dd class="num">${eur(esteMes)}</dd></div>
    <div class="cifra"><dt>Ganado ${anio}</dt><dd class="num">${eur(ganado)}</dd></div>
    <div class="cifra ${vencidas?'aviso':''}"><dt>Acciones vencidas</dt><dd class="num">${vencidas}</dd></div>
    <div class="acciones"><button class="btn" id="btnNueva">Nueva oportunidad</button></div>`;
  $('#btnNueva').onclick = () => abrirCajon(null);
}

/* ═══════ pipeline ═══════ */
function vPipeline(c){
  const ops = visibles(true);
  const enEtapa = e => e==='cerrado'
    ? ops.filter(o=>o.estado!=='abierta')
    : ops.filter(o=>o.estado==='abierta' && o.etapa===e);
  const max = Math.max(1,...ETAPAS.map(e=>enEtapa(e.id).reduce((s,o)=>s+o.valor,0)));
  c.innerHTML = filtrosHTML(false) + '<div class="tablero">' + ETAPAS.map(e=>{
    const l = enEtapa(e.id), t = l.reduce((s,o)=>s+o.valor,0);
    return `<section class="columna ${e.id==='standby'?'parada':''}" data-etapa="${e.id}">
      <header><h3>${e.nombre} <span class="num">${l.length}</span></h3>
      <div class="importe num">${eur(t)}</div>
      <div class="barra"><i style="width:${Math.round(t/max*100)}%"></i></div></header>
      <div class="lista">${l.length?l.map(tarjeta).join(''):'<p class="vacio">Nada en esta etapa. Arrastra una tarjeta aquí.</p>'}</div>
    </section>`;
  }).join('') + '</div>';
  activarFiltros(); activarArrastre();
}

function tarjeta(o){
  const edad = dias(fechaCreacion(o));
  const aviso = avisoInactividad(o);
  const cerrada = o.estado==='ganada' || o.estado==='perdida';
  const edadTxt = edad == null ? '—' : edad === 0 ? 'hoy' : edad + ' d';
  return `<button class="tarjeta ${cerrada?o.estado:(aviso!=null?'estancada':'')}" draggable="true" data-id="${o.id}">
    ${cerrada?`<span class="cierreEst">${o.estado==='ganada'?'Ganada':'Perdida'}</span>`:''}
    <div class="cuenta">${esc(cuentaNombre(o.cuenta))}</div>
    <div class="titulo">${esc(o.nombre)}${marcaSAT(o)}</div>
    <div class="pie"><span class="valor num">${eur(o.valor)}</span><span class="marcas">${aviso!=null?`<span class="inactiva num" title="${aviso} días sin actividad (umbral de ${etapaNombre(o.etapa)}: ${INACTIVIDAD_ETAPA[o.etapa]} d)">⚠ ${aviso} d</span>`:''}<span class="dias num" title="Días desde el primer presupuesto">${edadTxt}</span></span></div>
  </button>`;
}

function activarArrastre(){
  document.querySelectorAll('.tarjeta').forEach(t=>{
    t.onclick = () => abrirCajon(D.opos.find(o=>o.id===t.dataset.id));
    t.ondragstart = e => e.dataTransfer.setData('text/plain',t.dataset.id);
  });
  document.querySelectorAll('.columna').forEach(col=>{
    col.ondragover = e => { e.preventDefault(); col.classList.add('encima'); };
    col.ondragleave = () => col.classList.remove('encima');
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove('encima');
      const o = D.opos.find(x=>x.id===e.dataTransfer.getData('text/plain'));
      if(!o || o.etapa===col.dataset.etapa) return;
      if(col.dataset.etapa==='cerrado'){ abrirCajon(o); return; }   // hay que decir si es ganada o perdida
      if(o.estado!=='abierta'){ o.estado='abierta'; o.motivo=null; }
      o.etapa = col.dataset.etapa;
      o.tocada = new Date().toISOString();
      if(o.etapa === 'standby' && !o.revision){
        /* Regla: al pasar a Stand By hay que decir cuándo se revisa. */
        const r = prompt('¿Cuándo se revisa? (aaaa-mm-dd)',
                          new Date(Date.now()+30*864e5).toISOString().slice(0,10));
        if(r) o.revision = r;
      }
      pintar(); sincronizar(o);
    };
  });
}

/* ═══════ filtros ═══════ */

function activarFiltros(){
  const t = $('#fTexto');
  if(t) t.oninput = e => { filtros.texto = e.target.value; const p=e.target.selectionStart; pintar(); const n=$('#fTexto'); n.focus(); n.setSelectionRange(p,p); };
  if($('#fComercial')) $('#fComercial').onchange = e => { filtros.comercial = e.target.value; pintar(); };

  if($('#fActuacion')) $('#fActuacion').onchange = e => { filtros.actuacion = e.target.value; pintar(); };

/* ═══════ radar · previsiones ═══════ */
const claveMes = d => { const f = new Date(d); return `${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}`; };
function mesOffset(n){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+n); return d; }
const nombreMes = d => d.toLocaleDateString('es-ES',{month:'long',year:'numeric'});

function radarVisibles(){
  return abiertas().filter(o =>
    (!radar.comercial || o.owner===radar.comercial) &&
    (!radar.prob || o.prob >= Number(radar.prob)) &&
    (!radar.vertical || o.vertical===radar.vertical) &&
    (!radar.proyectista || o.proyectista===radar.proyectista));
}
function ordenar(l){
  const orden = {
    importe: (a,b)=>b.valor-a.valor,
    probabilidad: (a,b)=>b.prob-a.prob,
    etapa: (a,b)=>ETAPAS.findIndex(e=>e.id===b.etapa)-ETAPAS.findIndex(e=>e.id===a.etapa)
  }[radar.orden];
  return [...l].sort(orden);
}

function vRadar(c){
  const ops = radarVisibles();
  const inicioMes = claveMes(new Date());
  const vencidas = ops.filter(o => o.cierre && claveMes(o.cierre) < inicioMes);
  const sinFecha = ops.filter(o => !o.cierre);
  const columnas = [{ clave:'vencidas', titulo:'Vencidas', sub:'cierre pasado', lista:vencidas, aviso:true }];
  for(let i=0;i<MESES_RADAR;i++){
    const d = mesOffset(i), k = claveMes(d);
    columnas.push({ clave:k, titulo:nombreMes(d), sub: i===0?'mes actual':'mes +'+i,
                    lista: ops.filter(o=>o.cierre && claveMes(o.cierre)===k) });
  }

  c.innerHTML = `<div class="filtros">
    ${esManager()?`<select id="rCom"><option value="">Todos los comerciales</option>
      ${D.usuarios.map(u=>`<option value="${u.id}" ${radar.comercial===u.id?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select>`:''}
    <select id="rProb"><option value="">Cualquier probabilidad</option>
      ${[25,50,75].map(p=>`<option value="${p}" ${radar.prob==p?'selected':''}>Desde ${p}%</option>`).join('')}</select>
    <select id="rVert"><option value="">Todas las verticales</option>
      ${VERTICALES.map(v=>`<option ${radar.vertical===v?'selected':''}>${v}</option>`).join('')}</select>
    <select id="rProy"><option value="">Todos los proyectistas</option>
      ${PROYECTISTAS.map(p=>`<option ${radar.proyectista===p?'selected':''}>${p}</option>`).join('')}</select>
    <select id="rOrden">
      <option value="importe" ${radar.orden==='importe'?'selected':''}>Ordenar por importe</option>
      <option value="probabilidad" ${radar.orden==='probabilidad'?'selected':''}>Ordenar por probabilidad</option>
      <option value="etapa" ${radar.orden==='etapa'?'selected':''}>Ordenar por etapa</option>
    </select>
  </div>

  <div class="tablero previsiones">${columnas.map(col=>{
    const bruto = col.lista.reduce((s,o)=>s+o.valor,0);
    const fc = col.lista.reduce((s,o)=>s+o.valor*o.prob/100,0);
    return `<section class="columna ${col.aviso?'vencido':''}" data-mes="${col.clave}">
      <header>
        <h3>${col.titulo} <span class="num">${col.lista.length}</span></h3>
        <div class="submes">${col.sub}</div>
        <div class="cab2">
          <div><span>Pipeline</span><b class="num">${eur(bruto)}</b></div>
          <div><span>Forecast</span><b class="num">${eur(fc)}</b></div>
        </div>
      </header>
      <div class="lista">${col.lista.length
        ? ordenar(col.lista).map(o=>tarjetaRadar(o,col.aviso)).join('')
        : `<p class="vacio">${col.aviso?'Nada vencido. Bien.':'Sin cierres previstos.'}</p>`}</div>
    </section>`;
  }).join('')}</div>

  <div class="bandeja" data-mes="">
    <h3 style="font-size:13px;margin-bottom:2px">Sin fecha de cierre prevista <span class="num" style="font-weight:400;color:var(--gris)">${sinFecha.length} · ${eur(sinFecha.reduce((s,o)=>s+o.valor,0))}</span></h3>
    <p class="vacio" style="padding:0 0 8px">Estas oportunidades no entran en ninguna previsión. Arrastra una tarjeta a un mes para fecharla.</p>
    <div class="lista">${sinFecha.length?ordenar(sinFecha).map(o=>tarjetaRadar(o)).join(''):'<p class="vacio">Todas las oportunidades tienen fecha.</p>'}</div>
  </div>`;

  ['rCom:comercial','rProb:prob','rVert:vertical','rProy:proyectista','rOrden:orden'].forEach(par=>{
    const [id,campo] = par.split(':');
    if($('#'+id)) $('#'+id).onchange = e => { radar[campo] = e.target.value; pintar(); };
  });
  activarRadar();
}

function tarjetaRadar(o, vencida){
  return `<button class="tarjeta ${vencida?'vencida':''}" draggable="true" data-id="${o.id}">
    <div class="cuenta">${esc(cuentaNombre(o.cuenta))} · ${esc(o.vertical||'')}</div>
    <div class="titulo">${esc(o.nombre)}${marcaSAT(o)}</div>
    <div class="pie">
      <span class="valor num">${eur(o.valor)}</span>
      <span class="dias num">${o.prob}% · ${etapaNombre(o.etapa)}</span>
    </div>
    ${o.cierre?`<div class="pie" style="margin-top:3px"><span class="dias num">Cierre ${fechaCorta(o.cierre)}</span><span class="dias">${esc(usuario(o.owner))}</span></div>`:''}
  </button>`;
}

function activarRadar(){
  document.querySelectorAll('.tarjeta').forEach(t=>{
    t.onclick = () => abrirCajon(D.opos.find(o=>o.id===t.dataset.id));
    t.ondragstart = e => e.dataTransfer.setData('text/plain',t.dataset.id);
  });
  document.querySelectorAll('[data-mes]').forEach(col=>{
    col.ondragover = e => { e.preventDefault(); col.classList.add('encima'); };
    col.ondragleave = () => col.classList.remove('encima');
    col.ondrop = e => {
      e.preventDefault(); col.classList.remove('encima');
      const o = D.opos.find(x=>x.id===e.dataTransfer.getData('text/plain'));
      if(!o) return;
      const destino = col.dataset.mes;
      if(destino === 'vencidas') return;          // no se puede arrastrar hacia el pasado
      if(destino === '') { o.cierre = ''; }       // devolver a la bandeja
      else {
        const dia = o.cierre ? Number(o.cierre.slice(8,10)) : 15;
        const ultimo = new Date(Number(destino.slice(0,4)), Number(destino.slice(5,7)), 0).getDate();
        o.cierre = `${destino}-${String(Math.min(dia,ultimo)).padStart(2,'0')}`;
      }
      o.tocada = new Date().toISOString();
      pintar();
    };
  });
}

/* ═══════ lista ═══════ */
function vLista(c){
  const fa = filtros.actuacion;
  const ops = ordenarLista(visibles().filter(o => !fa ||
    (fa === '__sin' ? !o.tipo : o.tipo === fa)));
  const cols = COLUMNAS.filter(x => lista.cols.includes(x.k));

  c.innerHTML = filtrosHTML(true, true) + `
  <details class="columnas">
    <summary>Columnas · ${cols.length}</summary>
    <div>${COLUMNAS.map(x=>`<label><input type="checkbox" data-col="${x.k}"
      ${lista.cols.includes(x.k)?'checked':''} ${x.fijo?'disabled':''}> ${x.t}</label>`).join('')}</div>
  </details>` + (ops.length?`<table class="lista"><thead><tr>
    ${cols.map(x=>`<th class="${x.num?'der':''} ord ${lista.orden===x.k?'activa':''}" data-ord="${x.k}">
      ${x.t}<span class="flecha">${lista.orden===x.k?(lista.dir>0?'▲':'▼'):''}</span></th>`).join('')}
    </tr></thead><tbody>
    ${ops.map(o=>`<tr data-id="${o.id}">${cols.map(x=>
      `<td class="${x.num?'der num':''}">${celda(o,x.k)}</td>`).join('')}</tr>`).join('')}
    </tbody><tfoot><tr>
    ${cols.map(x=>`<td class="${x.num?'der num':''}">${
      x.k==='valor'    ? eur(ops.reduce((s,o)=>s+o.valor,0)) :
      x.k==='ponderado'? eur(ops.reduce((s,o)=>s+o.valor*o.prob/100,0)) :
      x.k==='cuota'    ? eur(ops.reduce((s,o)=>s+(o.cuota||0),0)) :
      x.k==='nombre'   ? ops.length+' oportunidades' : ''}</td>`).join('')}
    </tr></tfoot></table>`:'<p class="vacio">No hay oportunidades con estos filtros.</p>');

  activarFiltros();
  c.querySelectorAll('[data-col]').forEach(b => b.onchange = () => {
    lista.cols = COLUMNAS.filter(x => x.fijo ||
      c.querySelector(`[data-col="${x.k}"]`).checked).map(x=>x.k);
    guardarLista(); pintar();
    const d = $('.columnas'); if(d) d.open = true;
  });
  c.querySelectorAll('[data-ord]').forEach(th => th.onclick = () => {
    const k = th.dataset.ord;
    if(lista.orden === k) lista.dir = -lista.dir; else { lista.orden = k; lista.dir = 1; }
    guardarLista(); pintar();
  });
  c.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>abrirCajon(D.opos.find(o=>o.id===tr.dataset.id)));
}

/* ═══════ agenda ═══════ */
function vAgenda(c){
  const g = { vencidas:[], hoy:[], semana:[], despues:[] };
  pendientes().forEach(a=>{
    const d = dias(a.proxFecha);
    if(d>0) g.vencidas.push(a); else if(d===0) g.hoy.push(a); else if(d>=-7) g.semana.push(a); else g.despues.push(a);
  });
  const tit = { vencidas:'Vencidas', hoy:'Hoy', semana:'Próximos 7 días', despues:'Más adelante' };
  c.innerHTML = Object.entries(g).map(([k,l])=>!l.length?'':`<div class="grupo">
    <h3>${tit[k]} <span class="num">${l.length}</span></h3>
    <table><tbody>${l.map(a=>{
      const o = D.opos.find(x=>x.id===a.opo)||{};
      return `<tr data-id="${a.opo}">
        <td style="width:78px" class="num">${fechaCorta(a.proxFecha)}</td>
        <td><strong>${esc(a.prox)}</strong></td>
        <td>${esc(o.nombre||'')} · ${esc(cuentaNombre(o.cuenta))}</td>
        <td class="der num">${eur(o.valor)}</td>
        <td class="der"><button class="btn sec" data-hecha="${a.id}">Hecha</button></td></tr>`;
    }).join('')}</tbody></table></div>`).join('') || '<p class="vacio">No hay próximas acciones pendientes.</p>';
  c.querySelectorAll('tbody tr').forEach(tr=>tr.onclick=()=>abrirCajon(D.opos.find(o=>o.id===tr.dataset.id)));

  });
}

/* ═══════ Resultados On · Kam score ═══════
   Réplica del informe semanal del BOARD (hoja SEMANAL), calculada con Radar.
   · Instalaciones: fichas ganadas de Obra (instalación o ampliación, o sin
     tipo) que cuentan en resultados, por fecha real de cierre. El importe es
     el de la ficha, que viene del cubo (con descuento).
   · Seguridad física: las de tipo de sistema Seguridad física. Tecnología:
     el resto de Instalaciones, así las dos líneas suman el total.
   · Margen: (importe − coste) / importe de las ganadas con coste conocido.
   · Recurrente: cuota anual de las ganadas del periodo que tienen cuota.
     Nuevos abonados = cuántas son; cuota media = cuota / abonados.
   · Captación: importe de los presupuestos Beta10 por su fecha, de fichas de
     Obra que cuentan en resultados. Va al comercial de la ficha.
   · Objetivos: radar.objetivo_kpi (radar_v4_objetivos.sql). A fecha = meses
     cerrados + la parte del mes en curso por días laborables (lunes a
     viernes, incluido el día de corte), igual que el BOARD.
   Periodos: Mes = del día 1 a la fecha de corte. A fecha = del 1 de enero a
   la fecha de corte. Anual = lo vendido a fecha contra el objetivo del año. */
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const eur2 = n => new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',minimumFractionDigits:2}).format(n||0);
const MARGEN_OBJETIVO = 35.4;   // % del BOARD

const fechaLocal = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
let corteInf = fechaLocal(new Date());   // fecha de corte común a los dos informes

const diasDelMes = (a, m) => new Date(a, m, 0).getDate();
function laborables(a, m, hasta){
  let n = 0;
  for(let d = 1; d <= hasta; d++){ const w = new Date(a, m-1, d).getDay(); if(w > 0 && w < 6) n++; }
  return n;
}
/* Miles con punto de millar siempre (Intl no agrupa las cifras de 4 dígitos). */
const kMil = v => String(Math.round((Number(v)||0) / 1000)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const conSigno = n => n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0';
const fechaEs = iso => iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4);
const sumaDe = (lista, f) => lista.reduce((s, x) => s + (Number(f(x)) || 0), 0);

/* Objetivo de un KPI: del equipo (tag vacío) o de un comercial. */
function objetivoKpi(kpi, tag, corte){
  const a = +corte.slice(0,4), m = +corte.slice(5,7), d = +corte.slice(8,10);
  const filas = OBJ_KPI.filter(o => o.kpi === kpi && o.anio === a && (!tag || o.tag === tag));
  const deMes = mm => sumaDe(filas.filter(o => o.mes === mm), o => o.imp);
  const mes = deMes(m), lab = laborables(a, m, diasDelMes(a, m));
  let fecha = 0;
  for(let mm = 1; mm < m; mm++) fecha += deMes(mm);
  if(lab) fecha += mes * laborables(a, m, d) / lab;
  return { mes, fecha, anual:sumaDe(filas, o => o.imp), hay:filas.length > 0 };
}

const esObraInf = o => !o.tipo || TIPO_DE_ACTUACION[cod('actuacion', o.tipo)] === 'obra';
const esFisica  = o => o.servicio === 'Seguridad física';

/* Todo lo que usan los dos informes, del 1 de enero a la fecha de corte. */
function datosInforme(corte){
  const iniAnio = corte.slice(0,4) + '-01-01', iniMes = corte.slice(0,8) + '01';
  const ganadas = D.opos.filter(o => o.estado === 'ganada' && !o.exclusion
                                  && o.cierre && o.cierre >= iniAnio && o.cierre <= corte);
  const fichasObra = new Map(D.opos.filter(o => !o.exclusion && esObraInf(o)).map(o => [o.id, o]));
  const capt = D.pres
    .map(p => ({ opo:p.opo, fecha:String(p.fecha || '').slice(0,10), imp:p.importe }))
    .filter(p => p.opo && fichasObra.has(p.opo) && p.fecha >= iniAnio && p.fecha <= corte)
    .map(p => ({ ...p, owner:fichasObra.get(p.opo).owner }));
  return { corte, iniMes, ganadas, obra:ganadas.filter(esObraInf), capt };
}

function cabeceraInforme(titulo, sub){
  return `<div class="resHead">
    <div><h2 style="font-size:18px">${titulo}</h2>
      <p style="margin:2px 0 0;color:var(--gris);font-size:13px">${sub}</p></div>

      <label>Fecha de corte<input type="date" id="infCorte" value="${corteInf}"></label>

    </div>
  </div>
  ${OBJ_KPI.length ? '' : `<p class="infAviso">No hay objetivos cargados. Ejecuta <b>radar_v4_objetivos.sql</b> en Supabase y recarga.</p>`}`;
}
function enganchaCabecera(c){
  const f = c.querySelector('#infCorte');

}
const clasePct = p => p >= 1 ? 'ok' : p >= 0.85 ? 'md' : 'ko';

/* ── Resultados On ── */
function celdaOn(v, obj, anual){
  if(!obj) return `<div class="ronC sin"><div class="t"><b class="num">${kMil(v)}</b><span>sin objetivo</span></div><div class="br"><i style="width:0"></i></div></div>`;
  const p = v / obj;
  const txt = anual ? `/${kMil(obj)} · ${Math.round(p*100)}%` : `/${kMil(obj)} · ${conSigno(Math.round((p-1)*100))}%`;
  return `<div class="ronC ${clasePct(p)}"><div class="t"><b class="num">${kMil(v)}</b><span class="num">${txt}</span></div>
    <div class="br"><i style="width:${Math.max(0, Math.min(100, p*100)).toFixed(1)}%"></i></div></div>`;
}

function vResultadosOn(c){
  const corte = corteInf, d = datosInforme(corte), mes = +corte.slice(5,7);
  const delMes = (lista, f) => lista.filter(x => f(x) >= d.iniMes);
  const margen = lista => {
    const con = lista.filter(o => o.coste != null && o.coste > 0), v = sumaDe(con, o => o.valor);

  const txtMargen = m => m == null ? '—'

    { nombre:'Tecnología', sub:true, kpi:'tecnologia', items:d.obra.filter(o => !esFisica(o)), val:o => o.valor, fecha:o => o.cierre },
    { nombre:'Seguridad física', sub:true, kpi:'fisica', items:d.obra.filter(esFisica), val:o => o.valor, fecha:o => o.cierre },

    const o = objetivoKpi(b.kpi, null, corte);
    return `<div class="ronK${b.sub ? ' sub' : ''}">${b.nombre}${b.nota ? `<small>${b.nota}</small>` : ''}</div>
      ${celdaOn(vM, o.mes)}${celdaOn(vF, o.fecha)}${celdaOn(vF, o.anual, true)}`;
  }).join('');

  c.innerHTML = cabeceraInforme('Resultados On', `Corte ${fechaEs(corte)} · miles de € · ventas / objetivo`) + `
  <section class="ronCaja">
    <div class="infLeyenda"><span><i class="ok"></i>≥100%</span><span><i class="md"></i>85–99%</span><span><i class="ko"></i>&lt;85%</span></div>
    <div class="ronScroll"><div class="ronGrid">
      <div class="ronTh ronTh0"></div><div class="ronTh">Mes · ${MESES[mes-1].toLowerCase()}</div>
      <div class="ronTh">A fecha ${fechaEs(corte).slice(0,5)}</div><div class="ronTh">Anual ${corte.slice(0,4)}</div>
      ${filas}
    </div></div>
    <p class="infPie">Instalaciones: fichas ganadas de Obra que cuentan en resultados. Captación: presupuestos de Beta10 por su fecha.
      Objetivo a fecha: meses cerrados más la parte del mes por días laborables.</p>
  </section>`;
  enganchaCabecera(c);
}

/* ── Kam score ──
   Score = media del cumplimiento a fecha de aprobaciones y de captación.
   El objetivo de cada KAM es el suyo propio del BOARD (hoja OBJETIVOS).
   La flecha compara la posición con la de siete días antes. */
function filasKam(corte){
  const d = datosInforme(corte);
  const tags = [...new Set([...Object.keys(COMERCIALES), ...d.obra.map(o => o.owner), ...d.capt.map(p => p.owner)])]
    .filter(t => t && t !== 'sinasignar');
  return tags.map(tag => {
    const ob = d.obra.filter(o => o.owner === tag), ca = d.capt.filter(p => p.owner === tag);
    const r = { tag, nombre:COMERCIALES[tag] || tag,
      aM:sumaDe(ob.filter(o => o.cierre >= d.iniMes), o => o.valor), aF:sumaDe(ob, o => o.valor),
      cM:sumaDe(ca.filter(p => p.fecha >= d.iniMes), p => p.imp),  cF:sumaDe(ca, p => p.imp),
      oa:objetivoKpi('instalaciones', tag, corte), oc:objetivoKpi('captacion', tag, corte) };
    const pcts = [r.oa.fecha ? r.aF / r.oa.fecha : null, r.oc.fecha ? r.cF / r.oc.fecha : null].filter(x => x != null);
    r.score = pcts.length ? Math.round(sumaDe(pcts, x => x) / pcts.length * 100) : null;
    r.activo = r.aF || r.cF || r.oa.hay || r.oc.hay;
    return r;
  }).filter(r => r.activo)
    .sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || b.aF - a.aF || a.nombre.localeCompare(b.nombre, 'es'));
}

function celdaKam(v, obj){
  if(!obj) return `<td class="cel"><div class="sin"><span class="num">${kMil(v)}</span><small>—</small></div></td>`;
  const p = v / obj;
  return `<td class="cel"><div class="${clasePct(p)}"><span class="num">${kMil(v)}</span><small class="num">${Math.round(p*100)}%</small></div></td>`;
}

function vKamScore(c){
  const corte = corteInf, mes = +corte.slice(5,7);
  const filas = filasKam(corte);
  const antes = new Date(+corte.slice(0,4), mes-1, +corte.slice(8,10) - 7);
  const posAntes = new Map();
  if(antes.getFullYear() === +corte.slice(0,4)) filasKam(fechaLocal(antes)).forEach((r, i) => posAntes.set(r.tag, i));

  const eq = { aM:sumaDe(filas, r => r.aM), aF:sumaDe(filas, r => r.aF), cM:sumaDe(filas, r => r.cM), cF:sumaDe(filas, r => r.cF),
               oa:objetivoKpi('instalaciones', null, corte), oc:objetivoKpi('captacion', null, corte) };
  const pe = [eq.oa.fecha ? eq.aF / eq.oa.fecha : null, eq.oc.fecha ? eq.cF / eq.oc.fecha : null].filter(x => x != null);
  eq.score = pe.length ? Math.round(sumaDe(pe, x => x) / pe.length * 100) : null;

  const flecha = (tag, i) => {
    if(!posAntes.has(tag)) return '<span class="ksEq">·</span>';
    const dlt = posAntes.get(tag) - i;
    return dlt > 0 ? `<span class="ksUp">▲${dlt}</span>` : dlt < 0 ? `<span class="ksDn">▼${-dlt}</span>` : '<span class="ksEq">=</span>';
  };
  const ini = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();

  c.innerHTML = cabeceraInforme('Kam score', `Corte ${fechaEs(corte)} · miles de € · score = media de cumplimientos a fecha`) + `
  <section class="ronCaja">
    <div class="infLeyenda"><span><i class="ok"></i>≥100%</span><span><i class="md"></i>85–99%</span><span><i class="ko"></i>&lt;85%</span></div>
    <div class="ronScroll"><table class="ksTabla">
      <colgroup><col style="width:44px"><col style="width:34px"><col style="width:24%"><col><col><col><col><col style="width:70px"></colgroup>
      <thead>
        <tr><th></th><th></th><th></th><th class="grp" colspan="2">Aprobaciones</th><th class="grp" colspan="2">Captación</th><th></th></tr>
        <tr><th>Pos</th><th></th><th class="izq">KAM</th><th>${MESES[mes-1]}</th><th>A fecha</th><th>${MESES[mes-1]}</th><th>A fecha</th><th>Score</th></tr>
      </thead>
      <tbody>
        ${filas.map((r, i) => `<tr class="${i === 0 && r.score != null ? 'top' : ''}">
          <td class="pos">${i + 1}</td><td>${flecha(r.tag, i)}</td>
          <td class="izq"><span class="ksKam"><span class="ksAv"><b>${esc(ini(r.nombre))}</b>${FOTOS[r.tag] ? `<img src="${FOTOS[r.tag]}" alt="">` : ''}</span>${esc(r.nombre)}</span></td>
          ${celdaKam(r.aM, r.oa.mes)}${celdaKam(r.aF, r.oa.fecha)}${celdaKam(r.cM, r.oc.mes)}${celdaKam(r.cF, r.oc.fecha)}
          <td class="sc num">${r.score ?? '—'}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td></td><td></td><td class="izq">Equipo</td>
        ${celdaKam(eq.aM, eq.oa.mes)}${celdaKam(eq.aF, eq.oa.fecha)}${celdaKam(eq.cM, eq.oc.mes)}${celdaKam(eq.cF, eq.oc.fecha)}
        <td class="sc num">${eq.score ?? '—'}</td></tr></tfoot>
    </table></div>
    <p class="infPie">Aprobaciones: ventas de Instalaciones de cada KAM. Objetivos individuales del BOARD; la flecha compara con la posición de hace una semana.</p>
  </section>`;
  enganchaCabecera(c);
}


/* ═══════ Board ═══════
   Informe completo de dirección, con el estilo del BOARD (colores por línea:
   ocre total, petróleo tecnológica, verde física, morado recurrente).
   Usa las mismas reglas que Resultados On (ver arriba) y además:
   · radar.referencia (radar_v4_board.sql): objetivos por vertical, histórico
     2025 y objetivos de margen y ticket medio.
   · Ticket medio = aprobaciones / nº de fichas ganadas.
   · Hit rate por rango = ganadas / (ganadas + perdidas) de Obra, por importe,
     con cierre en los 365 días anteriores al corte.
   · Pipeline 2026 = abiertas de Obra que cuentan en resultados, sin Stand By,
     con cierre previsto hasta el 31/12 (las vencidas incluidas).
   · Previsión de cierre = ganado a fecha + pipeline × hit rate de su rango.
   · Previsión +4 meses: pipeline por mes de cierre previsto y probabilidad
     (95 · 80 · 40 · 20; lo de 10 va con 20). Hot = 80 o más. */
let bdVert = 'anio';   // quesito de verticales: 'mes' o 'anio'
const refVal = (g, c, a, m) => { const r = REF.find(x => x.grupo === g && x.clave === c && x.anio === a && x.mes === (m ?? null)); return r ? r.valor : null; };
const COL = { total:'#B8860B', tec:'#1F4E5F', fis:'#3B7D3B', rec:'#5B3A8C', cap:'#0C263A' };
const VERTS = [['casas','Casas'],['pisos','Pisos'],['comunidades','Comunidades'],['industria','Industria'],
               ['corporativos','Edif. corp.'],['retail','Retail'],['hoteles','Hoteles'],['otros','Otros']];
const COL_VERT = ['#B8860B','#E3C77A','#1F4E5F','#6E9CB0','#3B7D3B','#9CC39C','#5B3A8C','#B4B2A9'];
const RANGOS = [[0,5000,'Menos de 5K€'],[5000,15000,'5K€ – 15K€'],[15000,50000,'15K€ – 50K€'],[50000,100000,'50K€ – 100K€'],[100000,Infinity,'Más de 100K€']];
const rangoDe = v => RANGOS.findIndex(r => v >= r[0] && v < r[1]);
const vertDe = o => { const c = cod('vertical', o.vertical); return VERTS.some(v => v[0] === c) ? c : 'otros'; };

/* Importes compactos: 94K€ · 2,09M€ · 850 € */
function eK(v){
  v = Number(v) || 0; const a = Math.abs(v);
  if(a >= 1e6) return (Math.round(v/1e4)/100).toFixed(2).replace('.', ',') + 'M€';
  if(a >= 9950) return kMil(v) + 'K€';
  if(a >= 1000) return (Math.round(v/100)/10).toFixed(1).replace('.', ',') + 'K€';
  return Math.round(v) + ' €';
}
const pct1 = v => v == null ? '—' : v.toFixed(1).replace('.', ',') + '%';
const colPct = p => p == null ? 'var(--gris)' : p >= 1 ? 'var(--verde)' : p >= 0.85 ? '#8A6700' : 'var(--rojo)';

/* Objetivo de un periodo a partir del objetivo de cada mes (misma regla
   que objetivoKpi: meses cerrados + parte del mes por días laborables). */
function objPeriodo(deMes, corte){
  const a = +corte.slice(0,4), m = +corte.slice(5,7), d = +corte.slice(8,10);
  const lab = laborables(a, m, diasDelMes(a, m));
  let fecha = 0; for(let mm = 1; mm < m; mm++) fecha += deMes(mm);
  if(lab) fecha += deMes(m) * laborables(a, m, d) / lab;
  let anual = 0; for(let mm = 1; mm <= 12; mm++) anual += deMes(mm);
  return { mes:deMes(m), fecha, anual };
}

/* Presupuestos de fichas de Obra que cuentan, con su ficha. */
function captacionesTodas(){
  const fichas = new Map(D.opos.filter(o => !o.exclusion && esObraInf(o)).map(o => [o.id, o]));
  return D.pres.filter(p => p.opo && fichas.has(p.opo) && p.fecha)
    .map(p => { const o = fichas.get(p.opo); return { fecha:String(p.fecha).slice(0,10), imp:p.importe, owner:o.owner, vert:vertDe(o) }; });
}

/* ── piezas SVG ── */
function svgGauge(p, color){
  const P = (r, t) => { const a = Math.PI * (1 - t); return [70 + r*Math.cos(a), 66 - r*Math.sin(a)]; };
  const arco = (t0, t1, c, w) => { const [a,b] = P(46, t0), [x,y] = P(46, t1);
    return t1 <= t0 ? '' : `<path d="M${a.toFixed(1)} ${b.toFixed(1)} A46 46 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" fill="none" stroke="${c}" stroke-width="${w}"/>`; };
  const f = p == null ? 0 : Math.max(0, Math.min(p * 100, 150)) / 150, [nx, ny] = P(39, f);

function svgBarras(etq, series, objetivo){
  const W = 520, H = 170, x0 = 38, y0 = 146, n = etq.length, paso = (W - x0 - 6) / n;
  const max = Math.max(1, ...series.flatMap(s => s.v), ...(objetivo || []).map(v => v || 0)) * 1.12;
  const h = v => (v || 0) / max * (y0 - 14), ancho = Math.min(22, (paso - 6) / series.length);
  let s = '';
  for(let k = 0; k <= 3; k++){ const v = max/1.12 * k/3, y = y0 - h(v);
    s += `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="#EEF1F3"/><text x="${x0-4}" y="${(y+3).toFixed(1)}" font-size="8" text-anchor="end" fill="#888780">${eK(v)}</text>`; }
  etq.forEach((e, i) => {
    const xc = x0 + paso*i + paso/2, xi = xc - ancho*series.length/2;
    series.forEach((se, j) => { const v = se.v[i]; if(v == null) return;
      s += `<rect x="${(xi + j*ancho).toFixed(1)}" y="${(y0 - h(v)).toFixed(1)}" width="${(ancho-1).toFixed(1)}" height="${h(v).toFixed(1)}" fill="${se.c}"><title>${esc(se.n)} ${e}: ${eK(v)}</title></rect>`; });
    s += `<text x="${xc.toFixed(1)}" y="${y0+12}" font-size="8.5" text-anchor="middle" fill="#66757F">${e}</text>`;
  });
  if(objetivo){ const pts = objetivo.map((v, i) => `${(x0 + paso*i + paso/2).toFixed(1)},${(y0 - h(v)).toFixed(1)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="#0C263A" stroke-width="2"/>` + objetivo.map((v, i) => `<circle cx="${(x0 + paso*i + paso/2).toFixed(1)}" cy="${(y0 - h(v)).toFixed(1)}" r="2.5" fill="#0C263A"/>`).join(''); }

}

  const filaFc = `<div class="bdG bdG3b">

    <div class="bdBox"><div class="bdHd">PREVISIÓN DE VENTAS · 4 MESES
      <span class="bdLeyH">${cubos.map(x => `<i style="background:${x[2]}"></i>${x[1]}`).join(' ')}</span></div>

        <tr class="bdTot"><td>Total</td><td>${eK(sI(cA))} <small>(${cA.length})</small></td><td>${hrTot == null ? '—' : Math.round(hrTot*100) + '%'}</td><td>${eK(pipeTot)}</td><td>${eK(sumaDe(porRango, r => r.prev))}</td></tr>

  c.innerHTML = cabeceraInforme('Board', `Corte ${fechaEs(corte)} · ${MESES[M-1].toLowerCase()} ${A}`)

      <p class="infPie">Hit rate: ganadas / cerradas de Obra por rango, con cierre en los últimos 12 meses. Previsión de cierre: ganado a fecha más el pipeline sin Stand By

/* ═══════ Forecast mensual por comercial ═══════
   Lo ven todos los usuarios, con el equipo completo. La RLS solo deja a cada
   comercial leer sus fichas, así que los datos llegan por radar.forecast_mes
   (radar_v4_forecast.sql), que devuelve únicamente título, importe,
   probabilidad y fecha prevista. Las filas de fichas que el usuario puede
   leer se abren en el cajón; las de otros comerciales solo se ven.
   Compromiso = probabilidad >= umbral (80, incluido). Funnel = el resto.
   Tendencia = aprobado a fecha + compromiso. Objetivo: radar.objetivo. */
let fcAnio = new Date().getFullYear(), fcMes = new Date().getMonth() + 1;
let fcCache = {};            // 'aaaa-m' -> { datos, t }
let fcUltimo = null;         // último cálculo pintado, para reordenar al imprimir
const FC_VIGENCIA = 60000;   // ms antes de volver a pedir el mismo mes

/* Una ficha guardada o eliminada deja viejos todos los meses en caché (puede
   haber cambiado de mes). Se llama cuando la base ya ha confirmado la
   escritura, así que si el Forecast está en pantalla se vuelve a pedir. */
function forecastCambiado(){
  fcCache = {};
  if(vista === 'informes' && informe === 'forecast' && !abierta) pintar();
}

function kEur(v){
  const k = (Number(v) || 0) / 1000;
  if(k > 0 && k < 1) return k.toFixed(1).replace('.', ',') + 'K€';
  return String(Math.round(k)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'K€';
}

async function datosForecast(anio, mes, forzar){
  const k = anio + '-' + mes, c = fcCache[k];
  if(c && !forzar && Date.now() - c.t < FC_VIGENCIA) return c.datos;
  const { data, error } = await SB.rpc('forecast_mes', { p_anio:anio, p_mes:mes });
  if(error) throw error;
  if(!data) throw new Error('Tu usuario no tiene acceso al forecast.');
  fcCache[k] = { datos:data, t:Date.now() };
  return data;
}

function calcularForecast(d){
  const umbral = Number(d.umbral) || 80;
  const lineas = (d.lineas || []).map(l => ({
    id:String(l.id), comercial:l.comercial, titulo:l.titulo || 'Sin título',
    importe:Number(l.importe) || 0, prob:Number(l.probabilidad) || 0
  }));
  lineas.forEach(l => l.comp = l.prob >= umbral);
  /* Todos los comerciales salen aunque no tengan nada este mes. Un tag que
     no esté en COMERCIALES sale con su tag como nombre, para que no se pierda. */
  const tags = [...new Set([...Object.keys(COMERCIALES), ...lineas.map(l => l.comercial)])];
  const suma = a => a.reduce((s, l) => s + l.importe, 0);
  const reps = tags.map(tag => {
    const ops = lineas.filter(l => l.comercial === tag).sort((a, b) => b.importe - a.importe);
    const comp = suma(ops.filter(l => l.comp)), fun = suma(ops.filter(l => !l.comp));
    const nombre = COMERCIALES[tag] || tag;
    const ini = nombre.split(/\s+/).filter(Boolean).slice(0, 2).map(p => p[0]).join('').toUpperCase();
    return { tag, nombre, ini, ops, comp, fun, tot:comp + fun };
  }).sort((a, b) => b.comp - a.comp || b.tot - a.tot || a.nombre.localeCompare(b.nombre, 'es'));
  const valores = o => Object.values(o || {}).reduce((s, v) => s + (Number(v) || 0), 0);
  const objetivo = valores(d.objetivo), aprobado = valores(d.aprobado);
  const comp = reps.reduce((s, r) => s + r.comp, 0), fun = reps.reduce((s, r) => s + r.fun, 0);
  return { umbral, reps, vencidas:d.vencidas || { n:0, importe:0 },
    equipo:{ objetivo, aprobado, pendiente:Math.max(0, objetivo - aprobado), comp, fun,
             tendencia:aprobado + comp, nOps:lineas.length, nComp:lineas.filter(l => l.comp).length } };
}

/* Reparte las tarjetas en columnas: cada una a la más corta, en orden. */
function columnasForecast(reps, n){
  const cols = Array.from({ length:n }, () => ({ h:0, items:[] }));
  reps.forEach(r => { const c = cols.reduce((a, b) => b.h < a.h ? b : a); c.items.push(r); c.h += Math.max(1, r.ops.length) + 5; });
  return cols;
}

function tarjetaForecast(r){
  const legibles = new Set(D.opos.map(o => o.id));
  const filas = r.ops.length ? r.ops.map(o => {
    const el = legibles.has(o.id) ? 'button' : 'div';
    return `<${el} class="fcFila${o.comp ? ' comp' : ''}"${el === 'button' ? ` type="button" data-opo="${esc(o.id)}"` : ''} title="${esc(o.titulo)}">
      <span class="imp num">${kEur(o.importe)}</span><span class="pct num">${o.prob}%</span><span class="tit">${esc(o.titulo)}</span></${el}>`;
  }).join('') : '<p class="fcVacio">Sin oportunidades con cierre este mes</p>';
  return `<article class="fcCard">
    <header>
      <span class="fcFoto"><b>${esc(r.ini)}</b><img src="${FOTOS[r.tag] || 'fotos/' + encodeURIComponent(r.tag) + '.jpg'}" alt="" onerror="this.remove()"></span>
      <h3>${esc(r.nombre)}</h3>
      <small>${r.ops.length} oport.</small>
    </header>
    <div class="fcFilas">${filas}</div>
    <footer>
      <div class="c"><span class="et">COMPROMISO</span><span class="v num">${kEur(r.comp)}</span></div>
      <div><span class="et">FUNNEL</span><span class="v num">${kEur(r.fun)}</span></div>
      <div class="t"><span class="et">PIPELINE</span><span class="v num">${kEur(r.tot)}</span></div>
    </footer>
  </article>`;
}

function pintarCuerpoForecast(cuerpo, f, nCols){
  const e = f.equipo, hoy = new Date();
  const esteMes = fcAnio === hoy.getFullYear() && fcMes === hoy.getMonth() + 1;
  const n = nCols || (cuerpo.clientWidth < 720 ? 1 : cuerpo.clientWidth < 1150 ? 2 : 3);
  const sinObj = !e.objetivo;
  cuerpo.innerHTML = `
    <div class="fcKpis">
      <div class="fcKpi"><span class="et">Objetivo</span><span class="v num">${sinObj ? '—' : kEur(e.objetivo)}</span>${sinObj ? '<small>sin objetivo cargado</small>' : ''}</div>
      <div class="fcKpi"><span class="et">Aprobado a fecha</span><span class="v num verde">${kEur(e.aprobado)}</span></div>
      <div class="fcKpi"><span class="et">Pendiente</span><span class="v num rojo">${sinObj ? '—' : kEur(e.pendiente)}</span></div>
      <div class="fcKpi oscuro"><span class="et">Compromiso ≥${f.umbral}%</span><span class="v num">${kEur(e.comp)}</span><small>${e.nComp} oportunidades</small></div>
      <div class="fcKpi"><span class="et">Tendencia</span><span class="v num">${kEur(e.tendencia)}</span>${sinObj ? '' : `<small>${Math.round(e.tendencia / e.objetivo * 100)}% del objetivo</small>`}</div>
      <div class="fcKpi"><span class="et">Funnel &lt;${f.umbral}%</span><span class="v num">${kEur(e.fun)}</span><small>${e.nOps - e.nComp} oportunidades</small></div>
    </div>
    ${esteMes && f.vencidas.n ? `<div class="fcAviso">${f.vencidas.n} oportunidades abiertas con cierre previsto en meses anteriores (${kEur(f.vencidas.importe)}) no entran en este forecast. <button type="button" id="fcVerVencidas">Revisar en Previsiones</button></div>` : ''}
    <div class="fcCols">
      ${columnasForecast(f.reps, n).map(c => `<div class="fcCol">${c.items.map(tarjetaForecast).join('')}</div>`).join('')}
    </div>`;
  cuerpo.querySelectorAll('[data-opo]').forEach(b => b.onclick = () => {
    const o = D.opos.find(x => x.id === b.dataset.opo);
    if(o) abrirCajon(o);
  });
  const v = cuerpo.querySelector('#fcVerVencidas');
  if(v) v.onclick = () => { vista = 'radar'; pintar(); };
}

function vForecast(c){
  const hoy = new Date();
  c.innerHTML = `
  <div class="fcHead">
    <div>
      <h2>Forecast · ${MESES[fcMes - 1]} ${fcAnio}</h2>
      <p>Oportunidades abiertas de tipo Obra con cierre previsto en el mes · situación a ${hoy.toLocaleDateString('es-ES')}</p>
    </div>
    <div class="fcAcciones">
      <button class="btn sec flecha" id="fcAnt" type="button" aria-label="Mes anterior">‹</button>
      <span class="mes">${MESES[fcMes - 1]} ${fcAnio}</span>
      <button class="btn sec flecha" id="fcSig" type="button" aria-label="Mes siguiente">›</button>
      <button class="btn sec" id="fcActualizar" type="button">Actualizar</button>
      <button class="btn" id="fcImprimir" type="button">Imprimir / PDF</button>
    </div>
  </div>
  <div id="fcCuerpo"><p class="fcCargando">Cargando forecast…</p></div>`;
  const mover = n => { const d = new Date(fcAnio, fcMes - 1 + n, 1); fcAnio = d.getFullYear(); fcMes = d.getMonth() + 1; pintar(); };
  c.querySelector('#fcAnt').onclick = () => mover(-1);
  c.querySelector('#fcSig').onclick = () => mover(1);
  c.querySelector('#fcActualizar').onclick = () => cargarForecast(c, true);
  c.querySelector('#fcImprimir').onclick = () => window.print();
  cargarForecast(c, false);
}

async function cargarForecast(c, forzar){
  const anio = fcAnio, mes = fcMes;
  const cuerpo = c.querySelector('#fcCuerpo');
  try{
    const f = calcularForecast(await datosForecast(anio, mes, forzar));
    if(!cuerpo.isConnected || anio !== fcAnio || mes !== fcMes) return;   // el usuario ya cambió de mes
    fcUltimo = { cuerpo, f };
    pintarCuerpoForecast(cuerpo, f);
  }catch(e){
    if(cuerpo.isConnected) cuerpo.innerHTML = `<p class="fcCargando">No se ha podido cargar el forecast: ${esc(e.message || e)}</p>`;
  }
}

/* En papel siempre 3 columnas, sea cual sea el ancho de la pantalla. */

function vPanel(c){
  const ab = abiertas();
  const maxE = Math.max(1,...ETAPAS.map(e=>ab.filter(o=>o.etapa===e.id).reduce((s,o)=>s+o.valor,0)));
  const meses = [];
  for(let i=0;i<6;i++){
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+i);
    const k = d.toISOString().slice(0,7);
    meses.push({ et:d.toLocaleDateString('es-ES',{month:'short',year:'2-digit'}),
                 t:ab.filter(o=>(o.cierre||'').slice(0,7)===k).reduce((s,o)=>s+o.valor*o.prob/100,0) });
  }
  const maxM = Math.max(1,...meses.map(m=>m.t));
  const rank = D.usuarios.map(u=>({ n:u.nombre,
    g:D.opos.filter(o=>o.owner===u.id&&o.estado==='ganada').reduce((s,o)=>s+o.valor,0),
    a:ab.filter(o=>o.owner===u.id).reduce((s,o)=>s+o.valor,0) })).filter(r=>r.g||r.a).sort((x,y)=>(y.g+y.a)-(x.g+x.a));
  const maxR = Math.max(1,...rank.map(r=>r.g+r.a));
  const cerradas = mias().filter(o=>o.estado!=='abierta'), gan = cerradas.filter(o=>o.estado==='ganada');
  const tasa = cerradas.length?Math.round(gan.length/cerradas.length*100):0;
  const servicios = {};
  ab.forEach(o=>servicios[o.servicio] = (servicios[o.servicio]||0)+o.valor);
  const maxS = Math.max(1,...Object.values(servicios));

  c.innerHTML = `<div class="rejilla">
    <div class="bloque"><h3>Valor por etapa</h3>${ETAPAS.map(e=>{
      const t = ab.filter(o=>o.etapa===e.id).reduce((s,o)=>s+o.valor,0);
      return `<div class="fila-barra"><span>${e.nombre}</span><span class="pista"><i style="width:${Math.round(t/maxE*100)}%"></i></span><span class="cifra-fin num">${eur(t)}</span></div>`;
    }).join('')}</div>
    <div class="bloque"><h3>Previsión ponderada por mes de cierre</h3>${meses.map(m=>
      `<div class="fila-barra"><span>${m.et}</span><span class="pista"><i class="b" style="width:${Math.round(m.t/maxM*100)}%"></i></span><span class="cifra-fin num">${eur(m.t)}</span></div>`).join('')}</div>
    <div class="bloque"><h3>Por comercial</h3>${rank.map(r=>
      `<div class="fila-barra"><span>${esc(r.n)}</span><span class="pista"><i style="width:${Math.round(r.g/maxR*100)}%"></i><i class="b" style="width:${Math.round(r.a/maxR*100)}%"></i></span><span class="cifra-fin num">${eur(r.g+r.a)}</span></div>`).join('')}
      <p class="vacio" style="padding:6px 0">Azul oscuro: ganado. Gris: pipeline abierto.</p></div>
    <div class="bloque"><h3>Pipeline por servicio</h3>${Object.entries(servicios).sort((a,b)=>b[1]-a[1]).map(([s,v])=>
      `<div class="fila-barra"><span style="font-size:12px">${esc(s)}</span><span class="pista"><i style="width:${Math.round(v/maxS*100)}%"></i></span><span class="cifra-fin num">${eur(v)}</span></div>`).join('')}
      <h3 style="margin-top:16px">Cierres</h3>
      <div class="fila-barra"><span>Tasa de éxito</span><span class="pista"><i style="width:${tasa}%"></i></span><span class="cifra-fin num">${tasa}%</span></div>
      <div class="fila-barra"><span>Ganadas</span><span></span><span class="cifra-fin num">${gan.length} / ${cerradas.length}</span></div></div>
  </div>`;
}

        <div class="campo"><label>Origen</label><select id="cOrigen"><option value="">Sin indicar</option>${ORIGENES.map(x=>`<option ${o.origen===x?'selected':''}>${x}</option>`).join('')}</select></div>

    <div class="seccion"><h3>Equipo</h3>

function activarActividad(o){
  $('#btnAct').onclick = () => {
    const desc = $('#aDesc').value.trim(), prox = $('#aProx').value.trim();
    if(!desc && !prox) return;
    guardarNota(o); D.acts.push({ id:nuevoId('a'), opo:o.id, tipo:$('#aTipo').value.toLowerCase(), desc, fecha:new Date().toISOString(),
                  prox:prox||null, proxFecha:$('#aFecha').value||null, hecha:false, autor:comoUsuario });
    o.tocada = new Date().toISOString();
    abrirCajon(o); pintarCifras();
  };
}


/* La nota se graba aparte: en la base es inmutable y mueve la fecha de
   última actividad de la oportunidad. */
async function guardarNota(o){
  const desc = ($('#aDesc')||{}).value ? $('#aDesc').value.trim() : '';
  if(!desc) return;
  const hoy = new Date().toISOString().slice(0,10);
  const { error } = await SB.from('nota').insert({
    oportunidad_id : Number(o.id),
    tipo           : ($('#aTipo')||{value:'nota'}).value.toLowerCase(),
    texto          : desc,
    fecha_actividad: hoy,
    proxima_accion : (($('#aProx')||{}).value) || null,
    autor_nombre   : MI_PERFIL ? MI_PERFIL.nombre : 'Radar'
  });
  if(error) aviso('La nota no se ha guardado: ' + error.message);
}


/* Borrado. Solo direccion. Se usa para las duplicadas de la carga inicial.
   Los presupuestos de Beta10 no se borran: quedan sueltos y el importador
   los sacara como huerfanos. */
async function eliminar(o){
  if(!confirm('Eliminar "' + o.nombre + '" por ' + eur(o.valor) + '?\n\nNo se puede deshacer.')) return;
  const antes = D.opos;
  D.opos = D.opos.filter(x => x.id !== o.id);
  cerrarCajon(); pintar();
  if(String(o.id).startsWith('nuevo:')) return;
  const { error } = await SB.from('oportunidad').delete().eq('id', o.id);
  if(error){ D.opos = antes; pintar(); aviso('No se ha podido eliminar: ' + error.message); return; }
  forecastCambiado();
}

async function guardar(existente){
  let cuenta = $('#cCuenta').value;
  if(cuenta==='__n'){
    const n = $('#cCuentaNueva').value.trim();
    if(!n) return alert('Escribe el nombre de la cuenta nueva.');
    const { data:nc, error:ec } = await SB.from('cuenta')
            .insert({ nombre:n }).select('id').single();
    if(ec) return alert('No se ha podido crear la cuenta: ' + ec.message);
    cuenta = String(nc.id); D.cuentas.push({ id:cuenta, nombre:n });
  }
  if(!cuenta) return alert('Elige una cuenta para la oportunidad.');
  const nombre = $('#cNombre').value.trim();
  if(!nombre) return alert('La oportunidad necesita un nombre.');
  const datos = { nombre, cuenta, calle:$('#cCalle').value.trim(), poblacion:$('#cPoblacion').value.trim(), provincia:$('#cProvincia').value.trim(), tipo:$('#cActuacion').value, prescriptor:(($('#cPrescriptor')||{}).value||'').trim(), revision:(($('#cRevision')||{}).value||''), valor:Number($('#cValor').value)||0,
    prob:Number($('#cProb').value)||0, etapa:$('#cEtapa').value, cierre:$('#cCierre').value||'',
    servicio:$('#cServicio').value, origen:$('#cOrigen').value, owner:$('#cOwner').value,
    vertical:$('#cVertical').value, proyectista:$('#cProyectista').value,
    notas:$('#cNotas').value.trim(), tocada:new Date().toISOString() };
  let o;
  if(existente){ Object.assign(existente, datos); o = existente; }
  else { o = { id:'nuevo:'+nuevoId('o'), estado:'abierta', cuota:0, ...datos }; D.opos.unshift(o); }
  cerrarCajon(); pintar(); sincronizar(o);
}


</script>
